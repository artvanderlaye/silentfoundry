  R.className=R.className.replace(/\bdl-(cr|sm)-[\w-]+/g,'').replace(/\s+/g,' ').trim();
  d.defaultView.__LAB.applyWhenReady(v);
  setTimeout(function(){ var s=d.querySelector('#sf-lab-mount .fd');
    if(s&&v.cls){ s.className=s.className.replace(/\bdl-(cr|sm)-[\w-]+/g,'')+' '+v.cls; } },260);
  document.getElementById('nm').textContent=v.id+'   '+v.title;
  document.getElementById('th').textContent=v.thesis;
  [].forEach.call(document.querySelectorAll('#boxes .box'),function(b,j){
    b.className='box'+(V[j].id==='DEV'?' dev':'')+(j===cur?' on':''); });
  view('board');
}
function view(where){
  var d=doc(); if(!d) return; var w=d.defaultView;
  var sel={hero:'#sf-lab-mount .fd .oneframe',board:'#sf-lab-mount .fd .split',
           cream:'#sf-lab-mount .fd .fcats',funds:'#funds'}[where||'board'];
  var t=d.querySelector(sel); if(!t) return;
  var off=(where==='hero')?16:70;
  function go(){ w.scrollTo(0,Math.max(0,t.getBoundingClientRect().top+w.scrollY-off)); }
  go(); [150,500,1100].forEach(function(ms){ setTimeout(go,ms); });
}
function boot(){ if(install()){ booted=true; paint(); } else setTimeout(boot,250); }
document.getElementById('fr').addEventListener('load',function(){ booted=false; setTimeout(boot,1600); });
var bx=document.getElementById('boxes');
V.forEach(function(v,i){ var b=document.createElement('button'); b.className='box'; b.textContent=v.id;
  b.onclick=function(){ cur=i; paint(); }; bx.appendChild(b); });
[].forEach.call(document.querySelectorAll('#pos button'),function(b){ b.onclick=function(){ view(b.getAttribute('data-go')); }; });
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){ cur=(cur+1)%V.length; paint(); }
  if(e.key==='ArrowLeft'){ cur=(cur-1+V.length)%V.length; paint(); } });
</script>
