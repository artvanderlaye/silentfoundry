brand row, then the two offices  |  COMPACT 600-1023 - three columns  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped and centred"], ["06", "GROUPED OFFICES", "The two offices read as one location group behind a single bracket rule, with NAVIGATE as a narrow block at the end.", "MOBILE up to 599 - brand row, then the pair share the next row  |  COMPACT 600-1023 - brand and the group, NAVIGATE hidden  |  DESKTOP 1024-1599 - brand, group, NAVIGATE  |  WIDE 1600+ - capped and centred"], ["07", "LOGO LEFT / OFFICES RIGHT", "A fixed 38/62 split: the brand holds the left, the two offices share the right, the links sit on the bottom bar.", "MOBILE up to 599 - brand row, then the pair  |  COMPACT 600-1023 - 34/66  |  DESKTOP 1024-1599 - 38/62, both sides on floors  |  WIDE 1600+ - capped and centred"], ["08", "UNEQUAL FOUR-COLUMN GRID", "Four columns, deliberately unequal, with the offices on FIXED 208px tracks so their measure is a constant rather than a consequence of the viewport.", "MOBILE up to 599 - brand row, then the two offices  |  COMPACT 600-1023 - three columns, NAVIGATE hidden  |  DESKTOP 1024-1599 - four columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["09", "TWO-BAND FOOTER", "An upper band of brand and offices, a lower band on one hairline carrying the links and copyright together.", "MOBILE up to 599 - brand row, then the two offices  |  COMPACT 600-1023 - three columns  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped and centred"], ["10", "INLINE NAV", "No NAVIGATE column ever. The links are one restrained inline utility line, so the main row is always three zones.", "MOBILE up to 599 - brand row, then the two offices  |  COMPACT 600-1023 - three columns  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped and centred"], ["11", "DESKTOP PRESERVED / MOBILE TRANSFORM", "The large desktop is left as close to the current reading as the floors allow; all the design effort goes into the transformation downward.", "MOBILE up to 599 - brand row, then the two offices  |  COMPACT 600-1023 - three columns, NAVIGATE hidden  |  DESKTOP 1024-1279 four columns tightened / 1280-1599 the full 2fr 1fr 1fr 1fr reading  |  WIDE 1600+ - capped and centred"], ["12", "MOBILE TWO-TIER", "Built to test the two-tier phone directly: above 600 it is the repaired four-column grid, below it the brand takes a tier of its own.", "MOBILE up to 599 - brand row, then the two offices  |  COMPACT 600-1023 - three columns, NAVIGATE hidden  |  DESKTOP 1024-1599 - four columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["13", "COMPACT OFFICE DATA", "The wording is untouched but the address block is tightened - closer leading, a tighter bond to its heading - which lets the office floor drop and the four columns survive further down.", "MOBILE up to 599 - brand row, then the offices at the compact leading  |  COMPACT 600-1023 - three columns on a 150px floor  |  DESKTOP 1024-1599 - four columns on a 150px floor  |  WIDE 1600+ - capped and centred"], ["14", "TECHNICAL GRID", "Every zone is anchored to a 12-column grid on the same 16px gutter as the background field, and snaps between explicit column counts.", "MOBILE up to 599 - 12 / then 6 + 6  |  COMPACT 600-1023 - 4 + 4 + 4, NAVIGATE hidden  |  DESKTOP 1024-1599 - 4 + 3 + 3 + 2  |  WIDE 1600+ - the same spans inside the capped frame"], ["15", "MAX-WIDTH EDITORIAL", "The black field runs edge to edge but the content stops expanding at 1280, so 1280, 1440, 1920 and 2560 are the same composition.", "MOBILE up to 599 - brand row, then the two offices  |  COMPACT 600-1023 - three columns  |  DESKTOP 1024-1279 - four columns growing to the cap  |  WIDE 1280+ - frozen; only the margins grow"], ["16", "TOP UTILITY NAV", "The links become a quiet strip at the top of the field, separated from the content by a rule rather than by a column.", "MOBILE up to 599 - brand row, then the two offices  |  COMPACT 600-1023 - three columns  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped and centred"], ["17", "LOCATION-LED", "The two offices are the strongest thing in the footer - each on a short rule, headings stepped up - with the brand quiet at the left and the links tertiary.", "MOBILE up to 599 - brand row, offices beneath at 10.4px headings  |  COMPACT 600-1023 - three columns, headings at 12px  |  DESKTOP 1024-1599 - three columns, headings at 13px  |  WIDE 1600+ - capped and centred"], ["18", "SHARED LOCATION BLOCK", "The two offices live inside one location zone divided by a single hairline, so the footer reads as two objects rather than four columns.", "MOBILE up to 599 - brand row, then the shared zone  |  COMPACT 600-1023 - brand and the zone, NAVIGATE hidden  |  DESKTOP 1024-1599 - brand, zone, NAVIGATE  |  WIDE 1600+ - capped and centred"], ["19", "CLAUDE SYNTHESIS", "The current four-zone desktop reading, made stable: offices on fixed 208px tracks so the address measure is a constant of the design, one 1600 cap, three modes and nothing between them.", "MOBILE up to 599 - brand tier, then the two offices at 12px, links above the copyright  |  COMPACT 600-1023 - three columns on 200px tracks, links move to the bottom rule  |  DESKTOP 1024-1599 - four zones, offices on fixed 208px tracks  |  WIDE 1600+ - content capped at 1600 and centred; only the margins grow"]], F={"00": "<div class=\"fi\"><div class=\"z brand\"><a class=\"logo\" href=\"#\"><svg viewBox=\"10 36 111 40\" preserveAspectRatio=\"xMinYMid meet\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"10\" y=\"52\" font-family=\"Josefin Sans,sans-serif\" font-size=\"14\" font-weight=\"400\" letter-spacing=\"6\" fill=\"rgba(244,241,236,0.7)\">SILENT</text><text x=\"10\" y=\"72\" font-family=\"Josefin Sans,sans-serif\" font-size=\"14\" font-weight=\"400\" letter-spacing=\"6\" fill=\"rgba(244,2
