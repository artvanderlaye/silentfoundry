*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0a0a0a;}

:root{
  --gold:#c8a96e; --mid:#6b6560; --ink:#0a0a0a; --pale:rgba(244,241,236,.7);
  --grid:rgba(200,169,110,0.04);
  /* MODE D - DESKTOP 1024-1599, and MODE W above it */
  --pad:48px; --top:72px; --bot:44px; --gapx:48px; --gapy:40px;
  --body:12.8px; --lh:1.8; --h5:10.88px; --h5ls:2.176px; --h5mb:20px;
  --logow:160px; --logoh:50px; --tagmt:19px;
  --util:10.4px; --cr:10.4px; --utills:1.1px;
  --OFF:168px; --BRAND:218px; --CAP:1280px; --r:0px;
}
/* MODE C - COMPACT / TABLET 600-1023 */
@media(max-width:1023px){
  :root{ --pad:32px; --top:56px; --bot:32px; --gapx:32px; --gapy:30px;
         --h5mb:16px; --tagmt:16px; }
}
/* MODE M - MOBILE up to 599 */
@media(max-width:599px){

         --body:12px; --lh:1.7; --h5:9.6px; --h5ls:1.7px; --h5mb:9px;
         --logow:124px; --logoh:39px; --tagmt:14px;
         --util:9.6px; --cr:9.6px; --utills:.9px; --OFF:157px; }
}

.ft{position:relative;background:var(--ink);overflow:hidden;
  border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r);}
.ft::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
   repeating-linear-gradient(0deg,transparent,transparent 15px,var(--grid) 15px,var(--grid) 16px),
   repeating-linear-gradient(90deg,transparent,transparent 15px,var(--grid) 15px,var(--grid) 16px);}
/* one content box for every band, so nothing can start left of the wordmark */
.fi,.fb,.urow,.band2,.tstrip{position:relative;z-index:1;
  max-width:var(--CAP);margin-inline:auto;padding-left:var(--pad);padding-right:var(--pad);}
.fi{display:grid;align-items:start;column-gap:var(--gapx);row-gap:var(--gapy);
  padding-top:var(--top);padding-bottom:var(--bot);}
.z{min-width:0;}
.logo{display:block;width:var(--logow);height:var(--logoh);}
.logo svg{display:block;width:100%;height:100%;}
.tag{margin:var(--tagmt) 0 0;font:300 var(--body)/1.85 "DM Sans",sans-serif;color:var(--mid);
  max-width:280px;}
h5{margin:0 0 var(--h5mb);font:700 var(--h5)/1.2 "DM Sans",sans-serif;letter-spacing:var(--h5ls);
  text-transform:uppercase;color:var(--gold);}
address{font:300 var(--body)/var(--lh) "DM Sans",sans-serif;color:var(--mid);font-style:normal;}
/* the secondary system: copyright and the two utility links, one scale */
.cr{font:300 var(--cr)/1.6 "DM Sans",sans-serif;letter-spacing:.6px;color:rgba(244,241,236,.42);}
.util{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.util a{font:300 var(--util)/1.6 "DM Sans",sans-serif;letter-spacing:var(--utills);
  text-transform:uppercase;color:var(--mid);text-decoration:none;}
.util i{font-style:normal;color:rgba(200,169,110,.35);font-size:9px;}
.fb{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding-top:16px;padding-bottom:20px;flex-wrap:wrap;}
.urow{display:flex;justify-content:center;padding-bottom:20px;}
.band2{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-top:20px;padding-bottom:22px;border-top:1px solid rgba(200,169,110,.10);flex-wrap:wrap;}
.tstrip{display:flex;justify-content:flex-end;padding-top:18px;}
.ogi{display:grid;column-gap:var(--gapx);row-gap:var(--gapy);
  grid-template-columns:repeat(2,minmax(0,1fr));}
/* copyright and links stack on a phone: together they need 484px of content */
@media(max-width:599px){
  .fb,.band2{flex-direction:column;align-items:flex-start;gap:9px;}
  .urow{justify-content:flex-start;}
}

.ub{flex-direction:row-reverse;}
.uf{gap:12px;} .uf .sep{color:rgba(200,169,110,.35);font-style:normal;font-size:9px;}
.uh{align-items:flex-start;}
.uc{justify-content:center;} .ui{padding-bottom:10px;}
.bu{margin-top:20px;}
.bu .util{gap:10px;}
@media(max-width:599px){ .ub,.uf{flex-direction:column;} .uc{justify-content:flex-start;} }

var M=[["00", "CURRENT BASE", "The current spacing and breakpoint behaviour, unrepaired, with the new content model. Deliberately still uncapped and still forcing three zones into one phone row - it is the reference the other nineteen are measured against.", "MOBILE up to 768 - three zones forced into one row at 8.4px  |  COMPACT none - the phone rule runs all the way to 768  |  DESKTOP 769+ - three columns at 2fr 1fr 1fr, uncapped  |  WIDE none - the columns keep spreading"], ["01", "FIX CURRENT SYSTEM", "The current idea repaired and simplified: three columns each held to a measured floor, the frame capped, and copyright left with the two links right on one bottom line.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["02", "THREE COLUMNS + BOTTOM UTILITY", "The same three columns, but the utility line leads and the copyright sits opposite it - the links read as navigation, the copyright as a footnote.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["03", "THREE COLUMNS + CENTRED UTILITY", "The two links become a centred utility row on its own rule beneath the columns, with the copyright alone at the bottom left.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["04", "UTILITY UNDER BRAND", "Privacy and Terms belong to the brand block, set under the tagline as a short horizontal pair. The bottom line carries only the copyright.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["05", "UTILITY BOTTOM RIGHT", "The quietest structure: three columns above one hairline, copyright hard left and the two links hard right.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["06", "GROUPED OFFICES", "The two offices read as one location group behind a single bracket rule, which lets the brand take a genuinely wide left zone without leaving a hole.", "MOBILE up to 599 - brand row, then the pair share the next row  |  COMPACT 600-1023 - brand and the group  |  DESKTOP 1024-1599 - brand and the group, bracketed  |  WIDE 1600+ - capped and centred"], ["07", "LOGO LEFT / OFFICES RIGHT", "A fixed 38/62 split - the brand holds the left, the two offices share the right, and the links sit tight under the office side.", "MOBILE up to 599 - brand row, then the pair  |  COMPACT 600-1023 - 34/66  |  DESKTOP 1024-1599 - 38/62, both sides on floors  |  WIDE 1600+ - capped and centred"], ["08", "UNEQUAL THREE-COLUMN GRID", "Three columns, deliberately unequal, with the offices on FIXED 208px tracks so their measure is a constant of the design rather than a consequence of the viewport.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["09", "TWO-BAND FOOTER", "An upper band of brand and offices, a lower band on one hairline carrying the two links and the copyright together.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["10", "INLINE UTILITY", "The copyright and the two links run as one continuous secondary line, separated by a single dot - the lightest possible bottom layer.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["11", "DESKTOP PRESERVED / MOBILE TRANSFORM", "The large desktop keeps the generous 2fr brand reading of the current footer; all the design effort goes into the transformation downward.", "MOBILE up to 599 - brand row, then the two offices  |  COMPACT 600-1023 - three columns, brand tightened to 1fr  |  DESKTOP 1024-1279 brand at 1.4fr / 1280-1599 the full 2fr reading  |  WIDE 1600+ - capped and centred"], ["12", "MOBILE TWO-TIER", "Built to test the two-tier phone directly: above 600 the repaired three-column grid, below it the brand takes a tier of its own with extra air before the offices.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["13", "COMPACT OFFICE DATA", "The wording is untouched but the address block is tightened - closer leading, a tighter bond to its heading - which lets the office floor drop to 150px and the whole footer sit lower.", "MOBILE up to 599 - brand row, then the offices at the compact leading  |  COMPACT 600-1023 - three columns on a 150px floor  |  DESKTOP 1024-1599 - three columns on a 150px floor  |  WIDE 1600+ - capped and centred"], ["14", "TECHNICAL GRID", "Every zone is anchored to a 12-column grid on the same 16px gutter as the background field, and snaps between explicit column counts.", "MOBILE up to 599 - 12, then 6 + 6  |  COMPACT 600-1023 - 4 + 4 + 4  |  DESKTOP 1024-1599 - 5 + 4 + 3 aligned to the field  |  WIDE 1600+ - the same spans inside the capped frame"], ["15", "MAX-WIDTH EDITORIAL", "The black field runs edge to edge but the content stops at 1280 and the whole secondary layer is centred, so 1280 through 2560 are one composition.", "MOBILE up to 599 - brand row, then the offices; utility left-aligned  |  COMPACT 600-1023 - three columns, utility centred  |  DESKTOP 1024-1279 - three columns growing to the cap  |  WIDE 1280+ - frozen; only the margins grow"], ["16", "TOP UTILITY LINKS", "The two links become a quiet strip at the top right of the field, separated from the content by a rule, leaving the bottom line to the copyright alone.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["17", "LOCATION-LED", "The two offices are the strongest thing in the footer - each on a short rule with a stepped-up heading - and the brand sits quiet at the left.", "MOBILE up to 599 - brand row, offices beneath, headings at 10.4px  |  COMPACT 600-1023 - three columns, headings at 12px  |  DESKTOP 1024-1599 - three columns, headings at 13px  |  WIDE 1600+ - capped and centred"], ["18", "SHARED LOCATION BLOCK", "The two offices live inside one location zone divided by a single hairline, so the footer reads as two objects with a utility band beneath.", "MOBILE up to 599 - brand row, then the shared zone  |  COMPACT 600-1023 - brand and the zone  |  DESKTOP 1024-1599 - brand and the zone, divided  |  WIDE 1600+ - capped and centred"], ["19", "CLAUDE SYNTHESIS", "The current desktop reading, simplified and made stable: three zones with the offices on fixed 208px tracks so the address measure is a design constant, one 1600 cap, a hairline bottom line carrying copyright left and the two links right, and three modes with nothing between them.", "MOBILE up to 599 - brand tier, then the two offices at 12px; links above the copyright  |  COMPACT 600-1023 - three columns on 200px tracks; copyright and links share one line  |  DESKTOP 1024-1599 - three zones, offices on fixed 208px tracks  |  WIDE 1600+ - content capped at 1600 and centred; only the margins grow"]], F={"00": "<div class=\"fi\"><div class=\"z brand\"><a class=\"logo\" href=\"#\"><svg viewBox=\"10 36 111 40\" preserveAspectRatio=\"xMinYMid meet\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"10\" y=\"52\" font-family=\"Josefin Sans,sans-serif\" font-size=\"14\" font-weight=\"400\" letter-spacing=\"6\" fill=\"rgba(244,241,236,0.7)\">SILENT</text><text x=\"10\" y=\"72\" font-family=\"Josefin Sans,sans-serif\" font-size=\"14\" font-weight=\"400\" letter-spacing=\"6\" fill=\"rgba(244,241,236,0.7)\">FOUNDRY</text></svg></a><p class=\"tag\">Authentic brands premium products.</p></div><div class=\"z off hk\"><h5>Hong Kong</h5><address>Flat/Rm A, 20/F<br>Kiu Fu Commercial Building<br>300 Lockhart Road<br>Wanchai</address></div><div class=\"z off sh\"><h5>Shanghai</h5><address>Room 333, 3/F<br>Building 1, No. 2001<br>Yanggao North Road<br>Free Trade Zone</address></div></div><div class=\"fb\"><span class=\"cr\">&copy; 2026 Silent Foundry Group. All rights reserved.</span><nav class=\"util\"><a href=\"#\">Privacy Policy</a><i>&middot;</i><a href=\"#\">Terms of Use</a></nav></div>", "01": "<div class=\"fi\"><div class=\"z brand\"><a class=\"logo\" href=\"#\"><svg viewBox=\"10 36 111 40\" preserveAspectRatio=\"xMinYMid meet\" fill=\"no   cur=i; var m=M[i];
  document.documentElement.className='v'+m[0];
  document.getElementById('ft').innerHTML=F[m[0]];
  document.getElementById('num').textContent=m[0];
  document.getElementById('name').textContent=m[1];
  document.getElementById('note').textContent=m[2];
  document.getElementById('bp').textContent=m[3];
  document.getElementById('nm').textContent=m[0]+'  '+m[1];
  [].forEach.call(document.querySelectorAll('#boxes .box'),function(b,j){
    b.className='box'+(j===0?' base':'')+(j===i?' on':'');});
}
var bx=document.getElementById('boxes');
M.forEach(function(m,i){var b=document.createElement('button');b.className='box';
  b.textContent=m[0];b.onclick=function(){show(i);};bx.appendChild(b);});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')show((cur+1)%M.length);

show(0);
