<meta charset="utf-8"><title>Silent Foundry - 20 footers on the page</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&family=Josefin+Sans:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#111;color:#e8e2d9;
  font:300 13px/1.5 "DM Sans",system-ui,sans-serif;overflow:hidden}
#wrap{position:absolute;left:0;right:0;top:0;bottom:56px;background:#0a0a0a}
#nm{color:#8d918a;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;margin-top:7px}
iframe{border:0;width:100%;height:100%;display:block;background:#0a0a0a}
#bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,10,.97);
  border-top:1px solid rgba(216,184,122,.25);padding:7px 12px 8px;text-align:center;z-index:99}
.box{width:36px;height:28px;margin:0 2px;background:transparent;color:#d8b87a;
  border:1px solid rgba(216,184,122,.45);font:400 11px/1 "DM Sans",sans-serif;cursor:pointer}
.box.base{border-color:rgba(216,184,122,.95)}
.box.dev{width:46px;border-color:#d8b87a;color:#f0e0c0}
.box.on{background:#d8b87a;color:#0a0a0a}
</style>
<div id="wrap"><iframe id="fr" src="index.html"></iframe></div>
<div id="bar"><span id="boxes"></span><div id="nm"></div></div>
<script>
var CSS="\nhtml body .sflab *{box-sizing:border-box}\n\n\nhtml body .sflab{\n  --gold:#c8a96e; --mid:#6b6560; --ink:#0a0a0a; --pale:rgba(244,241,236,.7);\n  --grid:rgba(200,169,110,0.04);\n  /* MODE D - DESKTOP 1024-1599, and MODE W above it */\n  --pad:48px; --top:72px; --bot:44px; --gapx:48px; --gapy:40px;\n  --body:12.8px; --lh:1.8; --h5:10.88px; --h5ls:2.176px; --h5mb:20px;\n  --logow:160px; --logoh:50px; --tagmt:19px;\n  --util:10.4px; --cr:10.4px; --utills:1.1px;\n  --OFF:168px; --BRAND:218px; --CAP:1280px; --r:0px;\n}\n/* MODE C - COMPACT / TABLET 600-1023 */\n@media(max-width:1023px){\n  html body .sflab{ --pad:32px; --top:56px; --bot:32px; --gapx:32px; --gapy:30px;\n         --h5mb:16px; --tagmt:16px; }\n}\n/* MODE M - MOBILE up to 599 */\n@media(max-width:599px){\n  html body .sflab{ --pad:18px; --top:34px; --bot:20px; --gapx:16px; --gapy:22px;\n         --body:12px; --lh:1.7; --h5:9.6px; --h5ls:1.7px; --h5mb:9px;\n         --logow:124px; --logoh:39px; --tagmt:14px;\n         --util:9.6px; --cr:9.6px; --utills:.9px; --OFF:157px; }\n}\n\n.ft{position:relative;background:var(--ink);overflow:hidden;\n  border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r);}\n.ft::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;\n  background-image:\n   repeating-linear-gradient(0deg,transparent,transparent 15px,var(--grid) 15px,var(--grid) 16px),\n   repeating-linear-gradient(90deg,transparent,transparent 15px,var(--grid) 15px,var(--grid) 16px);}\n/* one content box for every band, so nothing can start left of the wordmark */\n.fi,.fb,.urow,.band2,.tstrip{position:relative;z-index:1;\n  /* LEFT-ALIGNED, never centred: the wordmark has to land in exactly the\n     place variation 00 puts it - one page margin in - at every width and in\n     every variation. A centred cap would move it inward on wide screens. */\n  max-width:var(--CAP);margin-left:0;margin-right:auto;\n  padding-left:var(--pad);padding-right:var(--pad);}\n.fi{display:grid;align-items:start;column-gap:var(--gapx);row-gap:var(--gapy);\n  padding-top:var(--top);padding-bottom:var(--bot);}\n.z{min-width:0;}\n.logo{display:block;width:var(--logow);height:var(--logoh);}\n.logo svg{display:block;width:100%;height:100%;}\n.tag{margin:var(--tagmt) 0 0;font:300 var(--body)/1.85 \"DM Sans\",sans-serif;color:var(--mid);\n  max-width:280px;}\nh5{margin:0 0 var(--h5mb);font:700 var(--h5)/1.2 \"DM Sans\",sans-serif;letter-spacing:var(--h5ls);\n  text-transform:uppercase;color:var(--gold);}\naddress{font:300 var(--body)/var(--lh) \"DM Sans\",sans-serif;color:var(--mid);font-style:normal;}\n/* the secondary system: copyright and the two utility links, one scale */\n.cr{font:300 var(--cr)/1.6 \"DM Sans\",sans-serif;letter-spacing:.6px;color:rgba(244,241,236,.42);}\n.util{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}\n/* The links and the copyright are the same size, but uppercase sits entirely\n   at cap height while sentence case is mostly x-height, so caps read visibly\n   larger at an identical font-size. Matching the case is the only way to make\n   them look equal as well as measure equal. */\n.util a{font:300 var(--util)/1.6 \"DM Sans\",sans-serif;letter-spacing:.6px;\n  text-transform:none;color:var(--mid);text-decoration:none;}\n.util i{font-style:normal;color:rgba(200,169,110,.35);font-size:9px;}\n.fb{display:flex;align-items:center;justify-content:space-between;gap:14px;\n  padding-top:16px;padding-bottom:20px;flex-wrap:wrap;}\n.urow{display:flex;justify-content:center;padding-bottom:20px;}\n.band2{display:flex;align-items:center;justify-content:space-between;gap:16px;\n  padding-top:20px;padding-bottom:22px;border-top:1px solid rgba(200,169,110,.10);flex-wrap:wrap;}\n.tstrip{display:flex;justify-content:flex-end;padding-top:18px;}\n.ogi{display:grid;column-gap:var(--gapx);row-gap:var(--gapy);\n  grid-template-columns:repeat(2,minmax(0,1fr));}\n/* copyright and links stack on a phone: together they need 484px of content */\n@media(max-width:599px){\n  .fb,.band2{flex-direction:column;align-items:flex-start;gap:9px;}\n  .urow{justify-content:flex-start;}\n}\n\n.ub{flex-direction:row-reverse;}\n.uf{gap:12px;} .uf .sep{color:rgba(200,169,110,.35);font-style:normal;font-size:9px;}\n.uh{align-items:flex-start;}\n.uc{justify-content:center;} .ui{padding-bottom:10px;}\n.bu{margin-top:20px;}\n.bu .util{gap:10px;}\n@media(max-width:599px){ .ub,.uf{flex-direction:column;} .uc{justify-content:flex-start;} }\n\n.ugrid{display:grid;grid-template-columns:var(--fcols,1fr 1fr 1fr);\n  column-gap:var(--gapx);align-items:center;}\n.ugrid .util{justify-self:end;}\n.ulc{justify-content:flex-start;gap:0;}\n.ulc .util{margin-left:auto;margin-right:auto;}\n@media(max-width:599px){\n  .ugrid{display:flex;flex-direction:column;align-items:flex-start;gap:9px;}\n  .ugrid .util{justify-self:start;}\n  .ulc{flex-direction:column;} .ulc .util{margin-left:0;}\n}\n\nhtml body .sflab.v14 .fi{grid-template-columns:repeat(12,minmax(0,1fr));column-gap:16px;}html body .sflab.v14 .brand{grid-column:span 5;}html body .sflab.v14 .hk{grid-column:span 4;}html body .sflab.v14 .sh{grid-column:span 3;}html body .sflab.v14 .fb{border-top:1px solid rgba(200,169,110,.13);padding-top:18px;margin-top:4px;}@media(min-width:600px) and (max-width:1023px){html body .sflab.v14 .brand{grid-column:span 4;}html body .sflab.v14 .hk{grid-column:span 4;}html body .sflab.v14 .sh{grid-column:span 4;}}@media(max-width:599px){html body .sflab.v14 .brand{grid-column:span 12;}html body .sflab.v14 .hk{grid-column:span 6;}html body .sflab.v14 .sh{grid-column:span 6;}}\nhtml body .sflab.v23{--CAP:1280px;}html body .sflab.v23 .fi,html body .sflab.v23 .fb,html body .sflab.v23 .urow,html body .sflab.v23 .band2,html body .sflab.v23 .tstrip{margin-left:auto;margin-right:auto;}html body .sflab.v23 .fi{grid-template-columns:minmax(var(--BRAND),36fr) minmax(var(--OFF),32fr) minmax(var(--OFF),32fr);}html body .sflab.v23 .fb{border-top:1px solid rgba(200,169,110,.13);padding-top:18px;margin-top:4px;}@media(min-width:600px) and (max-width:1023px){html body .sflab.v23 .fi{grid-template-columns:minmax(var(--BRAND),max-content) minmax(var(--OFF),1fr) minmax(var(--OFF),1fr);}}@media(max-width:599px){html body .sflab.v23 .fi{grid-template-columns:repeat(2,minmax(0,1fr));}html body .sflab.v23 .brand{grid-column:1 / -1;}html body .sflab.v23 .ogrp{grid-column:1 / -1;}}", FR={"14": "<div class=\"fi\"><div class=\"z brand\"><a class=\"logo\" href=\"#\"><svg viewBox=\"10 36 111 40\" preserveAspectRatio=\"xMinYMid meet\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"10\" y=\"52\" font-family=\"Josefin Sans,sans-serif\" font-size=\"14\" font-weight=\"400\" letter-spacing=\"6\" fill=\"rgba(244,241,236,0.7)\">SILENT</text><text x=\"10\" y=\"72\" font-family=\"Josefin Sans,sans-serif\" font-size=\"14\" font-weight=\"400\" letter-spacing=\"6\" fill=\"rgba(244,241,236,0.7)\">FOUNDRY</text></svg></a><p class=\"tag\">Authentic brands premium products.</p></div><div class=\"z off hk\"><h5>Hong Kong</h5><address>Flat/Rm A, 20/F<br>Kiu Fu Commercial Building<br>300 Lockhart Road<br>Wanchai</address></div><div class=\"z off sh\"><h5>Shanghai</h5><address>Room 333, 3/F<br>Building 1, No. 2001<br>Yanggao North Road<br>Free Trade Zone</address></div></div><div class=\"fb\"><span class=\"cr\">&copy; 2026 Silent Foundry Group. All rights reserved.</span><div class=\"util\"><a href=\"#\">Privacy Policy</a><i>&middot;</i><a href=\"#\">Terms of Use</a></div></div>", "23": "<div class=\"fi\"><div class=\"z brand\"><a class=\"logo\" href=\"#\"><svg viewBox=\"10 36 111 40\" preserveAspectRatio=\"xMinYMid meet\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"10\" y=\"52\" font-family=\"Josefin Sans,sans-serif\" font-size=\"14\" font-weight=\"400\" letter-spacing=\"6\" fill=\"rgba(244,241,236,0.7)\">SILENT</text><text x=\"10\" y=\"72\" font-family=\"Josefin Sans,sans-serif\" font-size=\"14\" font-weight=\"400\" letter-spacing=\"6\" fill=\"rgba(244,241,236,0.7)\">FOUNDRY</text></svg></a><p class=\"tag\">Authentic brands premium products.</p></div><div class=\"z off hk\"><h5>Hong Kong</h5><address>Flat/Rm A, 20/F<br>Kiu Fu Commercial Building<br>300 Lockhart Road<br>Wanchai</address></div><div class=\"z off sh\"><h5>Shanghai</h5><address>Room 333, 3/F<br>Building 1, No. 2001<br>Yanggao North Road<br>Free Trade Zone</address></div></div><div class=\"fb\"><span class=\"cr\">&copy; 2026 Silent Foundry Group. All rights reserved.</span><div class=\"util\"><a href=\"#\">Privacy Policy</a><i>&middot;</i><a href=\"#\">Terms of Use</a></div></div>"}, M=[["14", "TECHNICAL GRID", "Every zone is anchored to a 12-column grid on the same 16px gutter as the background field, and snaps between explicit column counts.", "MOBILE up to 599 - 12, then 6 + 6  |  COMPACT 600-1023 - 4 + 4 + 4  |  DESKTOP 1024-1599 - 5 + 4 + 3 aligned to the field  |  WIDE 1600+ - the same spans inside the capped frame"], ["23", "WEIGHTED 36 / 32 / 32", "The reverse of 22: the brand takes the larger share at 36 / 32 / 32, for a stronger brand presence without pinning it to the far left.", "MOBILE up to 599 - brand row, then the two offices; frame full width  |  COMPACT 600-1023 - three columns inside the frame  |  DESKTOP 1024-1599 - three columns in the centred frame  |  WIDE 1600+ - frame frozen at 1280px and centred"]], cur=0, ready=false, mode='foot';
/* DEV is the live footer as it stands on the page right now - nothing injected,
   nothing rebuilt. It is the only entry that is not a lab candidate. */
M.unshift(['DEV','CURRENT DEV FOOTER (LIVE)',
  'The footer exactly as it is on the development homepage right now - the real element, not a reconstruction. Still carries NAVIGATE with Team and Contact. This is the thing every candidate is replacing.',
  'Whatever the live page does at each width - this is the current behaviour, not a designed responsive system.']);

/* Option 23 is the approved footer and opens by default. */
cur=M.findIndex(function(m){return m[0]==='23';});

function doc(){var f=document.getElementById('fr');
  try{return f.contentDocument;}catch(e){return null;}}

/* Replace the page's own footer with the lab footer, once. */
function install(){
  var d=doc(); if(!d||!d.body) return false;
  if(!d.getElementById('sflab-css')){
    var st=d.createElement('style'); st.id='sflab-css'; st.textContent=CSS;
    d.head.appendChild(st);
  }
  if(!d.getElementById('sflab-host')){
    var host=d.createElement('div'); host.id='sflab-host'; host.className='sflab';
    /* take the real footer out and put the candidate in its place */
    var f=d.querySelector('footer'), fb=d.querySelector('.footer-bottom');
    /* the page sets `footer{display:block !important}`, so an inline hide loses.
       Set it important, and hide the old copyright bar the same way. */
    if(f&&f.parentNode){ f.parentNode.insertBefore(host,f);
      f.style.setProperty('display','none','important'); }
    else d.body.appendChild(host);
    if(fb) fb.style.setProperty('display','none','important');
  }
  return true;
}

function paint(){
  var d=doc(); if(!d) return;
  var host=d.getElementById('sflab-host');
  if(!host){ if(install()) host=d.getElementById('sflab-host'); if(!host) return; }
  var m=M[cur], dev=(m[0]==='DEV');
  /* DEV shows the page's own footer and hides the lab host; every other entry
     does the reverse. */
  var real=[].filter.call(d.querySelectorAll('footer'),function(x){return !x.closest('.sflab');})[0];
  var realBottom=d.querySelector('.footer-bottom');
  if(real) real.style.setProperty('display', dev?'block':'none','important');
  if(realBottom) realBottom.style.setProperty('display', dev?'flex':'none','important');
  host.style.display = dev?'none':'block';
  host.className='sflab'+(dev?'':' v'+m[0]);
  host.innerHTML = dev?'':'<footer class="ft">'+FR[m[0]]+'</footer>';
  document.getElementById('nm').textContent=m[0]+'   '+m[1];
  [].forEach.call(document.querySelectorAll('#boxes .box'),function(b,j){
    b.className='box'+(j===0?' dev':'')+(j===1?' base':'')+(j===cur?' on':'');});
  view();
}

function view(){
  var d=doc(); if(!d) return;
  var w=d.defaultView, host=d.getElementById('sflab-host');
  /* the page builds its sections lazily and re-runs its own scroll logic, so a
     single scrollIntoView gets undone. Drive it to an absolute position and
     re-assert it while the page settles. */
  function toFooter(){
    var real=[].filter.call(d.querySelectorAll('footer'),function(x){return !x.closest('.sflab');})[0];
    var t = (M[cur][0]==='DEV' && real) ? real : host;
    if(!t) return;
    /* on DEV the copyright sits in a separate bar BELOW the footer element, so
       the scroll target has to run to the bottom of that, not of the footer. */
    var bot = t.getBoundingClientRect().bottom;
    var cb = d.querySelector('.footer-bottom');
    if(M[cur][0]==='DEV' && cb && getComputedStyle(cb).display!=='none')
      bot = Math.max(bot, cb.getBoundingClientRect().bottom);
    var blockH = bot - t.getBoundingClientRect().top;
    var y = t.getBoundingClientRect().top + w.scrollY
          - Math.max(0, w.innerHeight - blockH) + 24;
    w.scrollTo(0, Math.max(0,y));
  }
  toFooter(); [120,400,900,1600].forEach(function(t){setTimeout(toFooter,t);});
}

function boot(){
  if(install()){ ready=true; paint(); }
  else setTimeout(boot,250);
}
document.getElementById('fr').addEventListener('load',function(){ ready=false; setTimeout(boot,600); });

var bx=document.getElementById('boxes');
M.forEach(function(m,i){var b=document.createElement('button');b.className='box';
  b.textContent=m[0];b.onclick=function(){cur=i;paint();};bx.appendChild(b);});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){cur=(cur+1)%M.length;paint();}
  if(e.key==='ArrowLeft'){cur=(cur-1+M.length)%M.length;paint();}});
window.addEventListener('resize',function(){setTimeout(view,80);});
</script>
