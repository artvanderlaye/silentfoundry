<meta charset="utf-8"><title>Silent Foundry - footer responsive lab</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#e8e2d9;font:300 13px/1.5 "DM Sans",system-ui,sans-serif}
#wrap{max-width:2000px;margin:0 auto;padding:20px 20px 190px}
h1{font:300 11px/1 "DM Sans",sans-serif;letter-spacing:2.72px;text-transform:uppercase;color:#8d918a;margin:0 0 8px}
#rNum{color:#d8b87a;letter-spacing:2px;font-size:11px}
#rName{font-size:19px;font-weight:300;letter-spacing:1px;margin:5px 0 6px}
#rNote{color:#8d918a;max-width:960px;font-size:12.4px;margin-bottom:7px;line-height:1.65}
#rMode{color:#6f736d;max-width:960px;font-size:11.4px;margin-bottom:16px;line-height:1.7}
#stage{background:#0d1013;border:1px solid rgba(216,184,122,.16);padding:16px;overflow:hidden}
#scaler{transform-origin:top left}
iframe{border:0;display:block;background:#0a0a0a}
#wbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.wb{padding:6px 11px;background:transparent;color:#8d918a;border:1px solid rgba(216,184,122,.3);
  font:400 11px/1 "DM Sans",sans-serif;cursor:pointer;letter-spacing:1px}
.wb.on{background:#d8b87a;color:#0a0a0a;border-color:#d8b87a}
#wlab{color:#6f736d;font-size:11px;letter-spacing:1px;margin-left:8px}
#bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,10,.97);
  border-top:1px solid rgba(216,184,122,.25);padding:11px 16px 13px;text-align:center}
.box{width:40px;height:32px;margin:0 3px 3px;background:transparent;color:#d8b87a;
  border:1px solid rgba(216,184,122,.45);font:400 11.5px/1 "DM Sans",sans-serif;cursor:pointer}
.box.base{border-color:rgba(216,184,122,.95)}
.box.on{background:#d8b87a;color:#0a0a0a}
#nm{color:#8d918a;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;margin-top:8px}
</style>
<div id="wrap">
 <h1>Silent Foundry - footer responsive lab - 20 directions x 8 widths</h1>
 <div id="rNum"></div><div id="rName"></div><div id="rNote"></div><div id="rMode"></div>
 <div id="wbar"></div>
 <div id="stage"><div id="scaler"><iframe id="fr" scrolling="no"></iframe></div></div>
</div>
<div id="bar"><span id="boxes"></span><div id="nm"></div></div>
<script>
var M=[["00", "CURRENT BASE", "The live footer exactly as it is now, including its behaviour at every width. This is the baseline the other nineteen are measured against.", "No cap, no defined modes. The four columns are 2fr 1fr 1fr 1fr and simply stretch; the phone drops to three zones with the type stepped down to 8.4px."], ["01", "FIX CURRENT SYSTEM", "The current idea, repaired: a capped four-column grid that stops growing, protects the address measure, and falls to three deliberate phone zones.", "A 1600px content cap centred in a full-width field. 1024+ four columns each held to a 176px floor; 600\u20131023 drops NAVIGATE and runs three; under 600 the three phone zones."], ["02", "THREE COLUMNS + BOTTOM NAV", "The main row carries only brand and the two offices. The four links move to the bottom bar opposite the copyright, which takes all the pressure off the main row.", "Three columns from 600 up, capped at 1500. Under 600 the links stay but stack under the copyright as one wrapped line rather than disappearing."], ["03", "THREE COLUMNS + CENTRED UTILITY", "Brand and the two offices on the main row; the four links become a centred utility line beneath them, with the copyright alone at the bottom left.", "Same three-column main row as 02, but the utility line is centred on its own rule rather than sharing the bottom bar. Copyright never moves."], ["04", "NAV UNDER BRAND", "Team and Contact sit under the brand block as part of the brand side; Privacy and Terms drop to the bottom bar. Tests whether the brand column can carry the primary links.", "Three columns above 600. On a phone the brand takes its own row and the two offices sit beneath it as equal halves, which lets the address keep its full size."], ["05", "NAV BOTTOM RIGHT", "The quietest large-screen structure: three columns above, copyright hard left and the four links hard right on one bottom rule.", "Editorial: a single hairline separates the content from a bar that holds copyright left and links right. On a phone the bar becomes two stacked lines, links above copyright."], ["06", "GROUPED OFFICES", "Hong Kong and Shanghai are treated as one location group in the middle rather than two unrelated columns, with NAVIGATE as a compact block at the end.", "The pair share a bracket rule so they read as one group. Above 1024 three zones; 600\u20131023 the group takes the whole right half and NAVIGATE goes; under 600 the brand takes a row and the pair sits beneath at full type size."], ["07", "LOGO LEFT / OFFICES RIGHT", "Deliberate asymmetry: the brand holds 38% of the width and the two offices share the remaining 62%, with the links on the bottom bar.", "A fixed 38/62 split that holds from 600 up, so the proportion never drifts. Under 600 the two halves become two rows and the offices split the width."], ["08", "UNEQUAL FOUR-COLUMN GRID", "Four columns, deliberately unequal: the brand is widest, the two offices equal and fixed, NAVIGATE narrowest. Nothing is a quarter of anything.", "The offices are held at a fixed 200px so the address measure can never be squeezed by a flexible track. Only the brand and NAVIGATE flex. Below 1024 NAVIGATE goes; below 600 the brand takes its own row."], ["09", "TWO-BAND FOOTER", "An upper band with the brand and both offices, and a lower band on a hairline carrying the links and the copyright together.", "Two bands separated by one hairline that runs at every width, so the footer reads as the same object throughout. The lower band reverses to links-over-copyright on a phone."], ["10", "INLINE NAV", "No NAVIGATE column at all. The four links become one restrained inline utility line on the bottom bar, in the small caps used elsewhere on the site.", "The links never occupy structural space, so the main row is always three zones and the composition cannot be pushed around by the longest link label."], ["11", "DESKTOP PRESERVED / MOBILE TRANSFORM", "The large desktop is left almost exactly as it is; all the design effort goes into the transformation down the widths.", "Four columns to 1024, three to 600, then the brand takes the first row on its own and the two offices become balanced halves beneath it \u2014 which is the only phone state that keeps the address at full size."], ["12", "MOBILE TWO-TIER", "Built specifically to test whether forcing all three zones into one phone row is the real problem. On a phone the brand gets a tier of its own.", "Identical to 01 above 600. Under 600: tier one is the mark, tier two is Hong Kong and Shanghai as equal halves, copyright beneath. No navigation on a phone."], ["13", "COMPACT OFFICE DATA", "The wording is untouched but the address block is tightened \u2014 closer leading and a tighter bond to its heading \u2014 so the four columns survive much further down.", "Tighter leading buys roughly 26px of column height and lets the office track drop to a 150px floor, so four columns hold to 1024 and three zones on a phone can run 9.6px instead of 9px."], ["14", "TECHNICAL GRID", "Every zone is anchored to the 16px background grid rather than to free-floating percentages. Columns snap between explicit grid counts.", "A 12-column grid on a 16px gutter, matching the background. Zones take 4/3/3/2 at desktop, 4/4/4 on tablet, 12 then 6/6 on a phone. Nothing ever lands off-grid."], ["15", "MAX-WIDTH EDITORIAL", "The black field runs edge to edge but the content stops expanding at 1280 and stays there, so 1440, 1920 and 2560 are the same composition.", "A hard 1280 content frame. Above it only the margins grow \u2014 the footer itself is pixel-identical at 1280, 1440, 1920 and 2560, which is the strictest possible answer to ultrawide drift."], ["16", "TOP UTILITY NAV", "The four links become a very quiet strip at the top right of the footer field, above the content, so the main row is only brand and offices.", "Utility is separated from content by a rule rather than by a column. The strip moves from right-aligned to left-aligned below 1024 so it never becomes a floating fragment."], ["17", "LOCATION-LED", "The two offices are the strongest thing in the footer. Their headings step up, the brand sits quietly to the left and the links become tertiary.", "Each office carries a short rule above its heading, so the pair reads as the organising structure. The heading steps 13 / 12 / 10.4 across the three modes \u2014 a controlled ramp, not a fluid one."], ["18", "SHARED LOCATION BLOCK", "The two offices live inside one shared location zone rather than as independent columns, so the footer reads as two objects, not four.", "One hairline inside the location zone separates the two cities and survives every mode, so the grouping is legible without a card or a border. The zone is a single grid child at all widths."], ["19", "CLAUDE SYNTHESIS", "The current large desktop composition, made stable: a capped frame, offices on fixed tracks that can never be squeezed, and a phone tier that keeps the address at full size.", "Three modes and nothing between them. DESKTOP 1024+: four zones, offices on fixed 208px tracks, content capped at 1600 and centred. TABLET 600-1023: NAVIGATE leaves the row for the bottom rule, offices stay at 200px. PHONE under 600: the mark takes tier one, the two offices split tier two at the FULL 12.8px address size, links above the copyright. The address measure is never a function of the viewport."]], W=[390, 430, 768, 1024, 1280, 1440, 1920, 2560], cur=0, cw=1440;
function fit(){
  var stage=document.getElementById('stage'), fr=document.getElementById('fr');
  var avail=stage.clientWidth-32, k=Math.min(1, avail/cw);
  document.getElementById('scaler').style.transform='scale('+k+')';
  var h=520; try{h=fr.contentDocument.documentElement.scrollHeight;}catch(e){}
  fr.style.height=h+'px';
  stage.style.height=(h*k+32)+'px';
}
function render(){
  var m=M[cur];
  document.getElementById('rNum').textContent=m[0];
  document.getElementById('rName').textContent=m[1];
  document.getElementById('rNote').textContent=m[2];
  document.getElementById('rMode').textContent='BREAKPOINTS - '+(m[3]||'');
  document.getElementById('nm').textContent=m[0]+'  '+m[1]+'   -   '+cw+'px';
  var fr=document.getElementById('fr');
  fr.style.width=cw+'px';
  fr.src='sf-footer-frame.html?v='+m[0];
  [].forEach.call(document.querySelectorAll('#boxes .box'),function(b,j){
    b.className='box'+(j===0?' base':'')+(j===cur?' on':'');});
  [].forEach.call(document.querySelectorAll('#wbar .wb'),function(b){
    b.className='wb'+(+b.dataset.w===cw?' on':'');});
  document.getElementById('wlab').textContent='rendered in a real '+cw+'px viewport';
  fit();
}
document.getElementById('fr').addEventListener('load',function(){setTimeout(fit,60);setTimeout(fit,420);});
window.addEventListener('resize',fit);
var wb=document.getElementById('wbar');
W.forEach(function(w){var b=document.createElement('button');b.className='wb';b.dataset.w=w;
  b.textContent=w;b.onclick=function(){cw=w;render();};wb.appendChild(b);});
var sp=document.createElement('span');sp.id='wlab';wb.appendChild(sp);
var bx=document.getElementById('boxes');
M.forEach(function(m,i){var b=document.createElement('button');b.className='box';b.textContent=m[0];
  b.onclick=function(){cur=i;render();};bx.appendChild(b);});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){cur=(cur+1)%M.length;render();}
  if(e.key==='ArrowLeft'){cur=(cur-1+M.length)%M.length;render();}
  if(e.key==='ArrowUp'){var i=W.indexOf(cw);cw=W[Math.min(W.length-1,i+1)];render();}
  if(e.key==='ArrowDown'){var i=W.indexOf(cw);cw=W[Math.max(0,i-1)];render();}
});
render();
</script>
