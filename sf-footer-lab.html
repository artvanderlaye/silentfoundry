<meta charset="utf-8"><title>Silent Foundry - 20 footers on the page</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&family=Josefin+Sans:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#111;color:#e8e2d9;
  font:300 13px/1.5 "DM Sans",system-ui,sans-serif;overflow:hidden}
#hd{padding:12px 18px 10px;border-bottom:1px solid rgba(216,184,122,.16)}
#num{color:#d8b87a;letter-spacing:2px;font-size:11px;display:inline-block}
#name{font-size:16px;font-weight:300;letter-spacing:1px;margin-left:12px;display:inline-block}
#note{color:#8d918a;font-size:11.6px;margin-top:5px;line-height:1.55;max-width:1100px}
#bp{color:#6f736d;font-size:10.6px;margin-top:4px;line-height:1.6;max-width:1100px}
#tools{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb{padding:5px 10px;background:transparent;color:#8d918a;border:1px solid rgba(216,184,122,.3);
  font:400 10.5px/1 "DM Sans",sans-serif;cursor:pointer;letter-spacing:1px}
.tb.on{background:#d8b87a;color:#0a0a0a;border-color:#d8b87a}
#stat{color:#6f736d;font-size:10.5px;letter-spacing:.5px;margin-left:6px}
#wrap{position:absolute;left:0;right:0;top:var(--hdh,150px);bottom:58px;background:#0a0a0a}
iframe{border:0;width:100%;height:100%;display:block;background:#0a0a0a}
#bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,10,.97);
  border-top:1px solid rgba(216,184,122,.25);padding:8px 12px 9px;text-align:center;z-index:99}
.box{width:36px;height:28px;margin:0 2px;background:transparent;color:#d8b87a;
  border:1px solid rgba(216,184,122,.45);font:400 11px/1 "DM Sans",sans-serif;cursor:pointer}
.box.base{border-color:rgba(216,184,122,.95)}
.box.on{background:#d8b87a;color:#0a0a0a}
</style>
<div id="hd">
  <span id="num"></span><span id="name"></span>
  <div id="note"></div><div id="bp"></div>

    <button class="tb" id="tTop">TOP OF PAGE</button>
    <button class="tb" id="tFull">WHOLE PAGE</button>
    <span id="stat"></span>
  </div>
</div>
<div id="wrap"><iframe id="fr" src="index.html"></iframe></div>
<div id="bar"><span id="boxes"></span></div>

-weight=\"400\" letter-spacing=\"6\" fill=\"rgba(244,241,236,0.7)\">FOUNDRY</text></svg></a><p class=\"tag\">Authentic brands premium products.</p></div><div class=\"z off hk\"><h5>Hong Kong</h5><address>Flat/Rm A, 20/F<br>Kiu Fu Commercial Building<br>300 Lockhart Road<br>Wanchai</address></div><div class=\"z off sh\"><h5>Shanghai</h5><address>Room 333, 3/F<br>Building 1, No. 2001<br>Yanggao North Road<br>Free Trade Zone</address></div></div><div class=\"fb\"><span class=\"cr\">&copy; 2026 Silent Foundry Group. All rights reserved.</span><div class=\"util\"><a href=\"#\">Privacy Policy</a><i>&middot;</i><a href=\"#\">Terms of Use</a></div></div>"}, M=[["00", "CURRENT BASE", "The current spacing and breakpoint behaviour, unrepaired, with the new content model. Deliberately still uncapped and still forcing three zones into one phone row - it is the reference the other nineteen are measured against.", "MOBILE up to 768 - three zones forced into one row at 8.4px  |  COMPACT none - the phone rule runs all the way to 768  |  DESKTOP 769+ - three columns at 2fr 1fr 1fr, uncapped  |  WIDE none - the columns keep spreading"], ["01", "FIX CURRENT SYSTEM", "The current idea repaired and simplified: three columns each held to a measured floor, the frame capped, and copyright left with the two links right on one bottom line.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["02", "THREE COLUMNS + BOTTOM UTILITY", "The same three columns, but the utility line leads and the copyright sits opposite it - the links read as navigation, the copyright as a footnote.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["03", "THREE COLUMNS + CENTRED UTILITY", "The two links become a centred utility row on its own rule beneath the columns, with the copyright alone at the bottom left.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["04", "UTILITY UNDER BRAND", "Privacy and Terms belong to the brand block, set under the tagline as a short horizontal pair. The bottom line carries only the copyright.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["05", "UTILITY BOTTOM RIGHT", "The quietest structure: three columns above one hairline, copyright hard left and the two links hard right.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["06", "GROUPED OFFICES", "The two offices read as one location group behind a single bracket rule, which lets the brand take a genuinely wide left zone without leaving a hole.", "MOBILE up to 599 - brand row, then the pair share the next row  |  COMPACT 600-1023 - brand and the group  |  DESKTOP 1024-1599 - brand and the group, bracketed  |  WIDE 1600+ - capped and centred"], ["07", "LOGO LEFT / OFFICES RIGHT", "A fixed 38/62 split - the brand holds the left, the two offices share the right, and the links sit tight under the office side.", "MOBILE up to 599 - brand row, then the pair  |  COMPACT 600-1023 - 34/66  |  DESKTOP 1024-1599 - 38/62, both sides on floors  |  WIDE 1600+ - capped and centred"], ["08", "UNEQUAL THREE-COLUMN GRID", "Three columns, deliberately unequal, with the offices on FIXED 208px tracks so their measure is a constant of the design rather than a consequence of the viewport.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["09", "TWO-BAND FOOTER", "An upper band of brand and offices, a lower band on one hairline carrying the two links and the copyright together.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["10", "INLINE UTILITY", "The copyright and the two links run as one continuous secondary line, separated by a single dot - the lightest possible bottom layer.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["11", "DESKTOP PRESERVED / MOBILE TRANSFORM", "The large desktop keeps the generous 2fr brand reading of the current footer; all the design effort goes into the transformation downward.", "MOBILE up to 599 - brand row, then the two offices  |  COMPACT 600-1023 - three columns, brand tightened to 1fr  |  DESKTOP 1024-1279 brand at 1.4fr / 1280-1599 the full 2fr reading  |  WIDE 1600+ - capped and centred"], ["12", "MOBILE TWO-TIER", "Built to test the two-tier phone directly: above 600 the repaired three-column grid, below it the brand takes a tier of its own with extra air before the offices.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["13", "COMPACT OFFICE DATA", "The wording is untouched but the address block is tightened - closer leading, a tighter bond to its heading - which lets the office floor drop to 150px and the whole footer sit lower.", "MOBILE up to 599 - brand row, then the offices at the compact leading  |  COMPACT 600-1023 - three columns on a 150px floor  |  DESKTOP 1024-1599 - three columns on a 150px floor  |  WIDE 1600+ - capped and centred"], ["14", "TECHNICAL GRID", "Every zone is anchored to a 12-column grid on the same 16px gutter as the background field, and snaps between explicit column counts.", "MOBILE up to 599 - 12, then 6 + 6  |  COMPACT 600-1023 - 4 + 4 + 4  |  DESKTOP 1024-1599 - 5 + 4 + 3 aligned to the field  |  WIDE 1600+ - the same spans inside the capped frame"], ["15", "MAX-WIDTH EDITORIAL", "The black field runs edge to edge but the content stops at 1280 and the whole secondary layer is centred, so 1280 through 2560 are one composition.", "MOBILE up to 599 - brand row, then the offices; utility left-aligned  |  COMPACT 600-1023 - three columns, utility centred  |  DESKTOP 1024-1279 - three columns growing to the cap  |  WIDE 1280+ - frozen; only the margins grow"], ["16", "TOP UTILITY LINKS", "The two links become a quiet strip at the top right of the field, separated from the content by a rule, leaving the bottom line to the copyright alone.", "MOBILE up to 599 - brand row, then the two offices; utility stacks above the copyright  |  COMPACT 600-1023 - three columns; copyright and links share one bottom line  |  DESKTOP 1024-1599 - three columns on measured floors  |  WIDE 1600+ - content capped at 1600 and centred"], ["17", "LOCATION-LED", "The two offices are the strongest thing in the footer - each on a short rule with a stepped-up heading - and the brand sits quiet at the left.", "MOBILE up to 599 - brand row, offices beneath, headings at 10.4px  |  COMPACT 600-1023 - three columns, headings at 12px  |  DESKTOP 1024-1599 - three columns, headings at 13px  |  WIDE 1600+ - capped and centred"], ["18", "SHARED LOCATION BLOCK", "The two offices live inside one location zone divided by a single hairline, so the footer reads as two objects with a utility band beneath.", "MOBILE up to 599 - brand row, then the shared zone  |  COMPACT 600-1023 - brand and the zone  |  DESKTOP 1024-1599 - brand and the zone, divided  |  WIDE 1600+ - capped and centred"], ["19", "CLAUDE SYNTHESIS", "The current desktop reading, simplified and made stable: three zones with the offices on fixed 208px tracks so the address measure is a design constant, one 1600 cap, a hairline bottom line carrying copyright left and the two links right, and three modes with nothing between them.", "MOBILE up to 599 - brand tier, then the two offices at 12px; links above the copyright  |  COMPACT 600-1023 - three columns on 200px tracks; copyright and links share one line  |  DESKTOP 1024-1599 - three zones, offices on fixed 208px tracks  |  WIDE 1600+ - content capped at 1600 and centred; only the margins grow"]], cur=0, ready=false, mode='foot';

function head(){var h=document.getElementById('hd').offsetHeight;
  document.documentElement.style.setProperty('--hdh',h+'px');}

function doc(){var f=document.getElementById('fr');
  try{return f.contentDocument;}catch(e){return null;}}

/* Replace the page's own footer with the lab footer, once. */
function install(){
  var d=doc(); if(!d||!d.body) return false;
  if(!d.getElementById('sflab-css')){
    var st=d.createElement('style'); st.id='sflab-css'; st.textContent=CSS;
    d.head.appendChild(st);
  }
  if(!d.getElementById('sflab-host')){
    var host=d.createElement('div'); host.id='sflab-host'; host.className='sflab';
    /* take the real footer out and put the candidate in its place */
    var f=d.querySelector('footer'), fb=d.querySelector('.footer-bottom');
    /* the page sets `footer{display:block !important}`, so an inline hide loses.
       Set it important, and hide the old copyright bar the same way. */
    if(f&&f.parentNode){ f.parentNode.insertBefore(host,f);
      f.style.setProperty('display','none','important'); }
    else d.body.appendChild(host);
    if(fb) fb.style.setProperty('display','none','important');
  }
  return true;
}

function paint(){
  var d=doc(); if(!d) return;
  var host=d.getElementById('sflab-host');
  if(!host){ if(install()) host=d.getElementById('sflab-host'); if(!host) return; }
  var m=M[cur];
  host.className='sflab v'+m[0];
  host.innerHTML='<footer class="ft">'+FR[m[0]]+'</footer>';
  document.getElementById('num').textContent=m[0];
  document.getElementById('name').textContent=m[1];
  document.getElementById('note').textContent=m[2];
  document.getElementById('bp').textContent=m[3];
  [].forEach.call(document.querySelectorAll('#boxes .box'),function(b,j){
    b.className='box'+(j===0?' base':'')+(j===cur?' on':'');});
  head(); view();
}

function view(){
  var d=doc(); if(!d) return;
  var w=d.defaultView, host=d.getElementById('sflab-host');
  /* the page builds its sections lazily and re-runs its own scroll logic, so a
     single scrollIntoView gets undone. Drive it to an absolute position and
     re-assert it while the page settles. */
  function toFooter(){
    if(!host) return;
    var y = host.getBoundingClientRect().top + w.scrollY
          - Math.max(0, w.innerHeight - host.offsetHeight) + 24;
    w.scrollTo(0, Math.max(0,y));
  }
  if(mode==='top' || mode==='full'){ w.scrollTo(0,0); }
  else { toFooter(); [120,400,900,1600].forEach(function(t){setTimeout(toFooter,t);}); }
  document.getElementById('stat').textContent =
    mode==='foot' ? 'showing the footer in place on the live page'
    : mode==='top' ? 'top of the page - scroll the frame freely'
    : 'scroll the frame to walk the whole page';
}

function boot(){
  if(install()){ ready=true; paint(); }
  else setTimeout(boot,250);
}
document.getElementById('fr').addEventListener('load',function(){ ready=false; setTimeout(boot,600); });

var bx=document.getElementById('boxes');
M.forEach(function(m,i){var b=document.createElement('button');b.className='box';
  b.textContent=m[0];b.onclick=function(){cur=i;paint();};bx.appendChild(b);});
function setMode(x,id){mode=x;
  ['tFoot','tTop','tFull'].forEach(function(k){document.getElementById(k).className='tb';});
  document.getElementById(id).className='tb on'; view();}
document.getElementById('tFoot').onclick=function(){setMode('foot','tFoot');};
document.getElementById('tTop').onclick=function(){setMode('top','tTop');};
document.getElementById('tFull').onclick=function(){setMode('full','tFull');};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){cur=(cur+1)%M.length;paint();}
  if(e.key==='ArrowLeft'){cur=(cur-1+M.length)%M.length;paint();}});
window.addEventListener('resize',function(){head();setTimeout(view,80);});
head();
</script>
