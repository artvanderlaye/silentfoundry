timers.push(setTimeout(fn,ms)); }\n  function stop(){ timers.forEach(clearTimeout); timers=[]; if(raf) cancelAnimationFrame(raf); raf=null;\n    ios.forEach(function(i){ try{ i.disconnect(); }catch(e){} }); ios=[]; }\n  L.mo.push(function(){ stop(); cells.forEach(function(c){ c.style.opacity=''; }); });\n\n  function onceIn(node,thr,fn){\n    try{ var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ fn(); io.disconnect(); } }); },{threshold:thr});\n      io.observe(node); ios.push(io); }catch(e){ fn(); }\n    at(14000,fn);\n  }\n  function handoff(){ if(br && br.className.indexOf('lab-go')<0) br.className+=' lab-go'; }\n  /* the proof also lands on its own arrival, so it is never held back by an\n     ambient pass the viewer may have scrolled straight past */\n  if(br) onceIn(br,0.3,handoff);\n\n  /* ---- the emphasis walk: one or two of the nine at a time --------------\n     RIB STRUCTURE is index 4 and is always the last thing emphasised, so the\n     eye is on it when the proof arrives. */\n  function walk(low,step,stopAt){\n    var i=0, order=[0,3,6,1,7,2,5,8,4];\n    function tick(){\n      cells.forEach(function(c,j){ c.style.opacity = (j===order[i]||j===order[(i+1)%9]) ? '1' : String(low); });\n      i++;\n      if(i>=order.length){                 /* one pass, then rest and hand off */\n        at(step, function(){ cells.forEach(function(c,j){ c.style.opacity = (j===4)?'1':String(low+0.06); });\n          at(1100, function(){ cells.forEach(function(c){ c.style.opacity=''; }); handoff(); }); });\n        return;\n      }\n      at(step,tick);\n    }\n    onceIn(d9, 0.25, function(){ at(stopAt||600,tick); });\n  }\n\n  if(o.mode==='breathe')  walk(0.88, 900, 500);\n  if(o.mode==='ambient')  walk(0.9, 1050, 700);\n  if(o.mode==='sweep'){                    /* one slow pass of light, L to R */\n    onceIn(d9,0.2,function(){ d9.className+=' lab-go'; at(1900,handoff); });\n  }\n  if(o.mode==='trace'){                    /* a );\n    L.mo.push(function(){ window.removeEventListener('scroll',onS); marks.forEach(function(m){ m.style.removeProperty('opacity'); }); });\n    onceIn(d9,0.3,function(){ at(800,handoff); });\n  }\n};\n\n/* shared spine / datum through all three cards */\nM.spine=function(o){ var s=sec(); if(s) s.className+=' lab-m-sp-'+o.mode; ['.oneframe','.split','.lab-bridge','.fcats'].forEach(function(c){ var n=$(c,s); if(n&&(o.mode==='datum'||o.mode==='sync'||o.mode==='line')) n.appendChild(el('i','lab-datum')); }); };\n\n/* the product strip grows by a measured factor; base height differs per\n   breakpoint, so it is read from the page rather than hard-coded */\nL.bigSlides=function(){\n  var s=sec(); if(!s) return; var st=$('.fstrip',s), sl=$('.fslide',s); if(!st||!sl) return;\n  if(st.className.indexOf('lab-m-img-big')<0){ R.style.removeProperty('--lab-slideh'); return; }\n  /* the page sizes the slide per breakpoint, so the base height is read with\n     the class off and the growth applied to that */\n  R.style.removeProperty('--lab-slideh');\n  st.classList.remove('lab-m-img-big');\n  var h=sl.getBoundingClientRect().height;\n  st.classList.add('lab-m-img-big');\n  if(h<80) return;\n  R.style.setProperty('--lab-slideh', Math.round(h*1.24)+'px');\n};\n\n/* ---------------------------------------------------- the baseline solver */\nfunction textBottom(e){ try{ var r=document.createRange(); r.selectNodeContents(e); var b=r.getBoundingClientRect(); if(b&&b.height) return b.bottom; }catch(x){} return e.getBoundingClientRect().bottom; }\nL.solve=function(){\n  if(L.vid==='BASE') return;\n  var s=sec(); if(!s) return; var q=$('.q22',s), ls=$$('.dna9 .d9 .dl',s); if(!q||ls.length!==9) return;\n  var props=['--lab-qh','--lab-swh','--lab-rh','--lab-qg','--lab-qp','--lab-tgt'];\n  /* when the construction block is absorbed or cut to two there is nothing to\n     align to the last label \u2014 the right column simply ends early, which is the\n     safe direction */\n  if($('.cblk.lab-m-cx-absorb',s)||$('.cblk.lab-m-cx-two',s)){ props.forEach(function(p){ R.style.removeProperty(p); }); R.classList.remove('lab-lv1','lab-lv2','lab-lv3'); return; }\n  if(window.innerWidth<=900){ props.forEach(function(p){ R.style.removeProperty(p); }); R.classList.remove('lab-lv1','lab-lv2','lab-lv3'); return; }\n  props.forEach(function(p){ R.style.removeProperty(p); });\n  R.style.setProperty('--lab-qh','auto');\n  function labBot(){ var b=-Infinity; ls.slice(6).forEach(function(l){ var t=textBottom(l); if(t>b) b=t; }); return b; }\n  function gap(){ var r=q.getBoundingClientRect(); return {need:labBot()-r.top, nat:r.height}; }\n  var g=gap(); if(!isFinite(g.need)) return;\n  /* not enough room: four levers, in order \u2014 the swatch strip (to 40px),\n     the right column's rhythm (to -12px), the construction drawings (to 26px),\n     then the compaction levels */\n  var sw=$('.msw',s); if(sw&&getComputedStyle(sw).display==='none') sw=$('.lab-spec',s);\n  var swH=sw?sw.getBoundingClientRect().height:0, rh=0, qg=38, n=0, lv=0;\n  R.classList.remove('lab-lv1','lab-lv2','lab-lv3');\n  /* the shrinking mode answers the same gap by taking the cards down instead,\n     so the material specimen above them is left at its designed height */\n  var shrink=!!$('.cblk.lab-m-cx-quiet',s);\n  while(!shrink && g.need<g.nat-0.5 && n<40){ n++;\n    if(sw&&swH>40){ swH=Math.max(40,swH-8); R.style.setProperty('--lab-swh',swH+'px'); }\n    else if(rh<12){ rh+=2; R.style.setProperty('--lab-rh',rh+'px'); }\n    else if(qg>26){ qg-=2; R.style.setProperty('--lab-qg',qg+'px'); }\n    else if(lv<3){ lv++; R.classList.add('lab-lv'+lv); }\n    else break;\n    g=gap();\n  }\n  /* TOO MUCH room is the other failure, and the live page has it: the cards\n     hang below the last label because sf-q22-js gives up under its own\n     minimum. A shrinking mode takes the height down to the label and then\n     lets the drawing and the card padding out of the way so nothing clips. */\n  if(shrink && g.need < g.nat-0.5){\n    R.style.setProperty('--lab-qh',Math.round(g.need)+'px');\n    var qg2=34, qp=9, m=0;\n    function spill(){ var v=0; $$('.qz',q).forEach(function(z){ v=Math.max(v, z.scrollHeight-z.clientHeight); }); return v; }\n    while(spill()>1 && m<24){ m++;\n      if(qg2>20){ qg2-=2; R.style.setProperty('--lab-qg',qg2+'px'); }\n      else if(qp>4){ qp-=1; R.style.setProperty('--lab-qp',qp+'px'); }\n      else break;\n    }\n    R.style.setProperty('--lab-tgt','0');\n    return;\n  }\n  R.style.setProperty('--lab-qh',Math.max(g.need,g.nat)+'px');\n  R.style.setProperty('--lab-tgt',Math.round(g.need-g.nat)+'');\n};\n\n/* ----------------------------------------------------------------- apply */\nL.cur=null; L.lastSec=null; L.played={};\nL.apply=function(v){\n  L.reset(); L.cur=v; L.lastSec=sec(); if(!v||v.id==='BASE') return;\n  var s=sec(); if(!s) return;\n  L.vid=v.id; R.setAttribute('data-sfdna',v.id);\n  (v.m||[]).forEach(function(m){ var fn=M[m[0]]; if(fn) try{ fn(m[1]||{}); }catch(e){ console.warn('LAB mech',m[0],e); } });\n  L.solve(); L.bigSlides(); [80,300,900,2000].forEach(function(t){ setTimeout(L.solve,t); setTimeout(L.bigSlides,t); });\n  try{ L.ro=new ResizeObserver(function(){ L.solve(); }); L.ro.observe(s); }catch(e){}\n};\n/* the page rebuilds this section on its own timers for ~9s after load (its\n   lab engine re-mounts the KEEP concept). When the section node changes\n   identity, the current variant is re-applied to the new one. */\n(function watch(){\n  var m=document.getElementById('sf-lab-mount');\n  if(!m){ setTimeout(watch,300); return; }\n  try{ new MutationObserver(function(){\n    if(L.cur&&L.cur.id!=='BASE'&&sec()&&sec()!==L.lastSec){ L.texts=[]; setTimeout(function(){ if(sec()!==L.lastSec) L.apply(L.cur); },40); }\n  }).observe(m,{childList:true}); }catch(e){}\n})();\nwindow.__SF_NOJUMP=true;\nwindow.addEventListener('resize',function(){ setTimeout(L.solve,120); setTimeout(L.bigSlides,140); });\nL.M=M; L.sec=sec;\n var V=[{"id": "BASE", "title": "THE PAGE AS IT IS", "thesis": "The live SWITCH sequence exactly as index.html renders it right now — nothing injected, nothing restyled. Every other box is measured against this.", "m": [], "notes": ""}, {"id": "SYN", "title": "THE SYNTHESIS", "thesis": "The selected build: BASE hero and 3×3, 04’s title and grid, 10’s material specimen, the page’s own construction cards quietened and brought up to the last label, 08’s walk on 25’s flush ground, and 12’s territories.", "m": [["chapters", {"names": ["THE PARENT", "THE EXTRACTION", "THE TRANSLATION"], "style": "bare", "hero": false, "cream": false}], ["intro", {"h4": "ACQUIRED <span class=\"sw-cy\">ASSET.</span>", "p": "SWITCH was acquired in 2025 out of liquidation. A strong product with clear DNA — the opportunity was to preserve it and build a new business around it. This is the preservation, done as engineers do it: read, measured, recorded.", "type": "quiet"}], ["grid", {"mode": "m16"}], ["cmf", {"mode": "specimen", "exact": true}], ["construction", {"mode": "quiet"}], ["rhythm", {"mode": "tight"}], ["bridge", {"type": "walk", "place": "between", "anim": "carry", "head": ""}], ["boundary", {"mode": "flush"}], ["territories", {"mode": "constraint"}], ["creamHead", {"html": "SAME PRINCIPLES.<br>NEW <span class=\"dl-hi\">OBJECTS.</span>"}], ["register", {"board": false, "frame": true}], ["spine", {"mode": "sync"}]], "notes": "One build, no lab apparatus: the hero, the nine and the product strip are the live page; everything selected sits on the 16px field; the frame runs from the top of the extraction to the foot of the bridge; the bridge meets the cream with no gap."}, {"id": "01", "title": "THE LEDGER", "thesis": "An engineering-office reading: three chapters, a Marshall-density grid, a CMF table, and a ledger that shows a rule leaving the parent and arriving in a new object.", "m": [["chapters", {"names": ["THE PARENT", "THE EXTRACTION", "THE TRANSLATION"], "style": "num"}], ["intro", {"h4": "READ. <span class=\"sw-cy\">REDUCE.</span><br>REAPPLY.", "p": "SWITCH was acquired in 2025 out of liquidation. We read the machine three ways — what it looks like, what it is made from, and what those choices mean — and reduced it to rules a new product can inherit.", "type": "big"}], ["grid", {"mode": "m30"}], ["register", {"kind": "cross", "cream": true}], ["cmf", {"mode": "table"}], ["construction", {"mode": "frames"}], ["rhythm", {"mode": "tight"}], ["essential", {"mode": "tag"}], ["receipt", {"mode": "hero"}], ["bridge", {"type": "ledger", "place": "between", "anim": "draw", "rows": [0, 1, 2], "head": "How a rule travels"}], ["boundary", {"mode": "flush"}], ["creamHead", {"html": "SAME RULES.<br>NEW <span class=\"dl-hi\">TERRITORY.</span>"}], ["imagery", {"mode": "tags"}], ["spine", {"mode": "datum"}]], "notes": "Bridge = ledger (rule → constraint → application) in the board’s own tone, flush to the cream. The three motorcycle-only readings are dimmed and marked FEATURE; the six rules carry no label."}, {"id": "02", "title": "THE RECEIPT", "thesis": "Proof first: every reading shows the piece of the parent it was taken from, and the bridge pairs a photo crop of the parent with the drawn application.", "m": [["chapters", {"names": ["ORIGIN", "RECORD", "TERRITORY"], "style": "num"}], ["intro", {"h4": "THE <span class=\"sw-cy\">RECORD.</span>", "p": "One elevation, nine readings, four materials, one way of building. Recorded from the SWITCH eSCRAMBLER in 2025 so that the next SWITCH object can be checked against it.", "type": "two"}], ["grid", {"mode": "m16"}], ["register", {"kind": "bracket", "cols": true}], ["cmf", {"mode": "rows"}], ["construction", {"mode": "rules"}], ["rhythm", {"mode": "tight"}], ["receipt", {"mode": "crops"}], ["rules", {"mode": "where"}], ["bridge", {"type": "pairs", "place": "between", "anim": "stagger", "rows": [0, 1, 3], "head": "From the parent · to the application"}], ["boundary", {"mode": "gap"}], ["creamHead", {"html": "NOTHING COPIED.<br>EVERYTHING <span class=\"dl-hi\">INHERITED.</span>"}], ["imagery", {"mode": "mono"}], ["spine", {"mode": "marks"}], ["register", {"board": false, "hero": true, "kind": "bracket"}]], "notes": "Photo crops at each reading’s anchor + “↳ where” lines under the labels. Reference slides go mono and are labelled; concept renders are labelled as studies."}, {"id": "03", "title": "RULES, NOT SHAPES", "thesis": "The nine labels are rewritten as rules, and the bridge is an equation: parent rule + new constraint = new object.", "m": [["chapters", {"names": ["SOURCE", "RULES", "BUILT"], "style": "num"}], ["intro", {"h4": "RULES, <span class=\"sw-cy\">NOT</span><br>SHAPES.", "p": "A shape belongs to one product. A rule belongs to every product after it. This board reads the SWITCH eSCRAMBLER for its rules — the things that will still be true when the object is a speaker, a lamp or a pack.", "type": "big"}], ["grid", {"mode": "m30"}], ["register", {"kind": "cross"}], ["cmf", {"mode": "rows"}], ["construction", {"mode": "frames"}], ["rhythm", {"mode": "tight"}], ["rules", {"mode": "replace"}], ["receipt", {"mode": "hero"}], ["bridge", {"type": "equation", "place": "between", "anim": "draw", "rows": [0, 1, 2], "head": "Same rule · new constraint"}], ["boundary", {"mode": "flush"}], ["territories", {"mode": "constraint"}], ["creamHead", {"html": "THE RULES TRAVEL.<br>THE SHAPES <span class=\"dl-hi\">DON’T.</span>"}], ["imagery", {"mode": "tags"}], ["spine", {"mode": "datum"}]], "notes": "Labels become verbs (“JOINTS STAY VISIBLE”). Territory descriptors become constraints (“hand-carried · mains-free”)."}, {"id": "04", "title": "THE QUIET ONE", "thesis": "Minimum apparatus: no marks, a faint grid, a four-row CMF, bare construction drawings and a single statement as the bridge.", "m": [["chapters", {"names": ["THE PARENT", "THE EXTRACTION", "THE TRANSLATION"], "style": "bare", "hero": false}], ["intro", {"h4": "ACQUIRED <span class=\"sw-cy\">ASSET.</span>", "p": "SWIT dge hangs its rule → application pins off the same line.", "m": [["chapters", {"names": ["THE PARENT", "THE EXTRACTION", "THE TRANSLATION"], "style": "num"}], ["intro", {"h4": "THE <span class=\"sw-cy\">EXTRACTION.</span>", "p": "What we kept when we bought SWITCH. Not the bike — the decisions that made it. Read from the parent, reduced to rules, and written down so they can be applied again.", "type": "big"}], ["grid", {"mode": "m30"}], ["cmf", {"mode": "rows"}], ["construction", {"mode": "frames"}], ["rhythm", {"mode": "tight"}], ["essential", {"mode": "bracket"}], ["hero", {"edge": true, "mode": "tag"}], ["bridge", {"type": "spine", "place": "between", "anim": "carry", "rows": [0, 1, 2, 3]}], ["boundary", {"mode": "flush"}], ["creamHead", {"html": "WHERE THE RULES<br>GO <span class=\"dl-hi\">NEXT.</span>"}], ["imagery", {"mode": "tags"}], ["spine", {"mode": "datum"}]], "notes": "The datum is gold in the hero, cyan on the board and bridge, teal on the cream — one line, three inks. The hero’s bottom edge fades gold → cyan."}, {"id": "07", "title": "GOLD TO CYAN", "thesis": "The hand-off is colour: the nine first paint in the hero’s gold and settle to cyan as you arrive; the bridge draws its parent rules in gold and its applications in white.", "m": [["chapters", {"names": ["THE PARENT", "THE EXTRACTION", "THE TRANSLATION"], "style": "num"}], ["intro", {"h4": "READ. <span class=\"sw-cy\">REDUCE.</span><br>REAPPLY.", "p": "SWITCH was acquired in 2025 out of liquidation. We read the machine three ways — what it looks like, what it is made from, and what those choices mean — and reduced it to rules a new product can inherit.", "type": "big"}], ["grid", {"mode": "m30"}], ["register", {"kind": "cross", "hero": true}], ["cmf", {"mode": "rows"}], ["construction", {"mode": "frames"}], ["rhythm", {"mode": "tight"}], ["handoff", {"mode": "gold"}], ["hero", {"edge": true}], ["bridge", {"type": "ledger", "place": "between", "anim": "draw", "rows": [0, 1, 2], "head": "Read in gold · carried in cyan"}], ["boundary", {"mode": "flush"}], ["creamHead", {"html": "SAME RULES.<br>NEW <span class=\"dl-hi\">TERRITORY.</span>"}], ["imagery", {"mode": "tags"}], ["spine", {"mode": "gold"}]], "notes": "One-time: gold → cyan on the 3×3 when it enters the viewport (reduced-motion: cyan immediately). Eyebrows on the board go gold to match the hero."}, {"id": "08", "title": "THE WALK", "thesis": "The method is the story: READ → REDUCE → REAPPLY, named as chapters, restated in the intro, and drawn as the bridge.", "m": [["chapters", {"names": ["READ", "REDUCE", "REAPPLY"], "style": "num"}], ["intro", {"h4": "READ. <span class=\"sw-cy\">REDUCE.</span><br>REAPPLY.", "p": "SWITCH was acquired in 2025 out of liquidation. We read the machine three ways — what it looks like, what it is made from, and what those choices mean — and reduced it to rules a new product can inherit.", "type": "big"}], ["grid", {"mode": "m16"}], ["register", {"kind": "bracket"}], ["cmf", {"mode": "rows"}], ["construction", {"mode": "list"}], ["rhythm", {"mode": "tight"}], ["receipt", {"mode": "hero"}], ["bridge", {"type": "walk", "place": "between", "anim": "carry", "head": "Read · reduce · reapply"}], ["boundary", {"mode": "flush"}], ["creamHead", {"html": "BUILT FROM THE<br>SAME <span class=\"dl-hi\">RULES.</span>"}], ["imagery", {"mode": "drawn"}], ["spine", {"mode": "datum"}]], "notes": "Construction language becomes a four-line list so the drawings sit larger. The carousel is replaced by four line studies marked as studies."}, {"id": "09", "title": "THE DRAWING OFFICE", "thesis": "The densest drawing: a fine grid, column brackets, corner registers, a rule under every reading, framed construction cells and a ledger bridge — density from geometry, not from labels.", "m": [["chapters", {"names": ["ORIGIN", "RECORD", "TERRITORY"], "style": "num"}], ["intro", {"h4": "THE <span class=\"sw-cy\">RECORD.</span>", "p": "One elevation, nine readings, four materials, one way of building. Recorded from the SWITCH eSCRAMBLER in 2025 so that the next SWITCH object can be checked against it.", "type": "two"}], ["grid", {"mode": "fine"}], ["register", {"kind": "cross", "cols": true, "cream": true}], ["cmf", {"mode": "table"}], ["construction", {"mode": "frames"}], ["rhythm", {"mode": "tighter"}], ["rules", {"mode": "sub"}], ["receipt", {"mode": "strip"}], ["bridge", {"type": "ledger", "place": "between", "anim": "draw", "rows": [0, 1, 2, 3], "head": "How a rule travels"}], ["boundary", {"mode": "hairline"}], ["creamHead", {"html": "SAME RULES.<br>NEW <span class=\"dl-hi\">TERRITORY.</span>"}], ["imagery", {"mode": "drawn"}]], "notes": "The densest reading. Everything here is drawn or measured; nothing is coded."}, {"id": "10", "title": "MATERIAL EDITORIAL", "thesis": "CMF leads the right column as a large specimen strip with material, finish and function beneath it; the construction language is a list; the bridge is a ledger.", "m": [["chapters", {"names": ["THE PARENT", "THE EXTRACTION", "THE TRANSLATION"], "style": "bare"}], ["intro", {"h4": "WHAT WE <span class=\"sw-cy\">BOUGHT.</span>", "p": "SWITCH came out of liquidation in 2025 with one product and a clear character. The asset is not the motorcycle. It is the design DNA underneath it — and this is what it looks like written down.", "type": "lead"}], ["grid", {"mode": "m30"}], ["cmf", {"mode": "specimen"}], ["construction", {"mode": "list"}], ["rhythm", {"mode": "tight"}], ["meaning", {"mode": "line"}], ["bridge", {"type": "ledger", "place": "between", "anim": "stagger", "rows": [2, 0, 3], "head": "The same materials, the same rules"}], ["boundary", {"mode": "flush"}], ["creamHead", {"html": "BUILT FROM THE<br>SAME <span class=\"dl-hi\">RULES.</span>"}], ["imagery", {"mode": "tags"}]], "notes": "The specimen strip keeps the base’s proportions (46/34/12/8) but names material, finish and function under each."}, {"id": "11", "title": "ESSENTIAL / INCIDENTAL", "thesis": "Six of the nine are rules; three are features of a motorcycle. The incidental three are dimmed, and only the six travel across the bridge.", "m": [["chapters", {"names": ["THE PARENT", "THE EXTRACTION", "THE TRANSLATION"], "style": "num"}], ["intro", {"h4": "RULES, <span class=\"sw-cy\">NOT</span><br>SHAPES.", "p": "A shape belongs to one product. A rule belongs to every product after it. This board reads the SWITCH eSCRAMBLER for its rules — the things that will still be true when the object is a speaker, a lamp or a pack.", "type": "big"}], ["grid", {"mode": "m30"}], ["register", {"kind": "cross"}], ["cmf", {"mode": "rows"}], ["construction", {"mode": "frames"}], ["rhythm", {"mode": "tight"}], ["essential", {"mode": "tag"}], ["bridge", {"type": "ledger", "place": "between", "anim": "draw", "rows": [0, 1, 2], "head": "Six rules travel · three features stay"}], ["boundary", {"mode": "flush"}], ["creamHead", {"html": "THE RULES TRAVEL.<br>THE SHAPES <span class=\"dl-hi\">DON’T.</span>"}], ["imagery", {"mode": "tags"}], ["spine", {"mode": "datum"}]], "notes": "HORIZONTAL STANCE, RUBBER RIBBING and TANK PANEL are marked FEATURE and dimmed; the rest are RULE. The 3×3 stays intact."}, {"id": "12", "title": "MEANING BAND", "thesis": "Physical → meaning: a three-principle band closes the board (honesty, electric architecture, serviceability) and the bridge is a statement.", "m": [["chapters", {"names": ["THE PARENT", "THE EXTRACTION", "THE TRANSLATION"], "style": "num"}], ["intro", {"h4": "WHAT IT LOOKS LIKE. <span class=\"sw-cy\">WHAT IT MEANS.</span>", "p": "Every physical decision on the parent stands for a behaviour. Exposed structure means honesty; a visible cell means the object is built around its energy; open joints mean it can be serviced. The behaviours are what carry.", "type": "big"}], ["grid", {"mode": "m16"}], ["register", {"kind": "bracket"}], ["cmf", {"mode": "rows"}], ["construction", {"mode": "rules"}], ["rhythm", {"mode": "tight"}], ["meaning", {"mode": "band"}], ["bridge", {"type": "statement", "place": "between", "anim": "stagger", "rows": [0, 1, 3], "big": "The behaviours carry.<br><span>The shapes stay behind.</span>", "text": "A SWITCH speaker is not a small motorcycle. It is honest about its structure, built around its energy, and made to be opened — because those are the rules, and the rules are what was bought."}], ["boundary", {"mode": "flush"}], ["creamHead", {"html": "SAME PRINCIPLES.<br>NEW <span class=\"dl-hi\">OBJECTS.</span>"}], ["territories", {"mode": "constraint"}], ["imagery", {"mode": "tags"}]], "notes": "The old CHARACTER & PRINCIPLES trio returns as meaning, not as a heading."}, {"id": "13", "title": "THE STRADDLE", "thesis": "The bridge physically straddles the boundary: half on the black board, half on the cream, so the translation is the edge itself.", "m": [["chapters", {"names": ["THE PARENT", "THE EXTRACTION", "THE TRANSLATION"], "style": "num"}], ["intro", {"h4": "THE <span class=\"sw-cy\">EXTRACTION.</span>", "p": "What we kept when we bought SWITCH. Not the bike — the decisions that made it. Read from the parent, reduced to rules, and written down so they can be applied again.", "type": "big"}], ["grid", {"mode": "m30"}], ["register", {"kind": "cross"}], ["cmf", {"mode": "rows"}], ["construction", {"mode": "frames"}], ["rhythm", {"mode": "tight"}], ["essential", {"mode": "tag"}], ["receipt", {"mode": "hero"}], ["bridge", {"type": "ledger", "place": "between", "anim": "draw", "rows": [0, 1, 2], "head": "How a rule travels"}], ["boundary", {"mode": "straddle"}], ["creamHead", {"html": "SAME RULES.<br>NEW <span class=\"dl-hi\">TERRITORY.</span>"}], ["imagery", {"mode": "tags"}]], "notes": "Bridge inset 40px each side, lifted with a soft shadow. Board padding grows to make room; cream tucks under it."}, {"id": "14", "title": "THE STRIP", "thesis": "The bridge is four drawn studies, one per territory; the carousel of renders is replaced by the same drawings, marked as studies.", "m": [["chapters", {"names": ["THE ASSET", "THE DNA", "THE TERRITORIES"], "style": "num"}], ["intro", {"h4": "FROM ONE MACHINE <span class=\"sw-cy\">TO A</span><br>FAMILY.", "p": "SWITCH was acquired in 2025 with one product. The family that follows will not look like a motorcycle. It will be built by the same rules — and this is where those rules are taken from the parent.", "type": "big"}], ["grid", {"mode": "m30"}], ["register", {"kind": "cross"}], ["cmf", {"mode": "rows"}], ["construction", {"mode": "frames"}], ["rhythm", {"mode": "tight"}], ["bridge", {"type": "strip", "place": "between", "anim": "draw", "head": "Four territories · drawn from the nine"}], ["boundary", {"mode": "flush"}], ["creamHead", {"html": "FROM ONE MACHINE<br>TO A <span class=\"dl-hi\">FAMILY.</span>"}], ["imagery", {"mode": "drawn", "note": "No product photography in the territories until there is a product to photograph."}]], "notes": "The most honest imagery position: nothing on the cream pretends to exist."}, {"id": "15", "title": "CONSTRAINT LANGUAGE", "thesis": "Territories are constraints, not categories: “hand-carried · mains-free” instead of “power · light”. The bridge is the equation.", "m": [["chapters", {"names": ["THE PARENT", "THE EXTRACTION", "THE TRANSLATION"], "style": "num"}], ["intro", {"h4": "RULES, <span class=\"sw-cy\">NOT</span><br>SHAPES.", "p": "A shape belongs to one product. A rule belongs to every product after it. This board reads the SWITCH eSCRAMBLER for its rules — the things that will still be true when the object is a speaker, a lamp or a pack.", "type": "big"}], ["grid", {"mode": "m30"}], ["register", {"kind": "cross"}], ["cmf", {"mode": "table"}], ["construction", {"mode": "frames"}], ["rhythm", {"mode": "tight"}], ["essential", {"mode": "tag"}], ["bridge", {"type": "equation", "place": "between", "anim": "draw", "rows": [3, 0, 1], "head": "Same rule · new constraint · new object"}], ["boundary", {"mode": "flush"}], ["creamHead", {"html": "SAME RULES.<br>NEW <span class=\"dl-hi\">TERRITORY.</span>"}]
