exed so the report can refer to R·07 rather than “the round one”."}, {"id": "10", "title": "MATERIAL EDITORIAL", "thesis": "CMF leads the right column as a large specimen strip with material, finish and function beneath it; the construction language is a list; the bridge is a ledger.", "m": [["chapters", {"names": ["THE PARENT", "THE EXTRACTION", "THE TRANSLATION"], "style": "bare"}], ["intro", {"ey": "DNA extraction", "h4": "WHAT WE <span class=\"sw-cy\">BOUGHT.</span>", "p": "SWITCH came out of liquidation in 2025 with one product and a clear character. The asset is not the motorcycle. It is the design DNA underneath it — and this is what it looks like written down.", "type": "lead"}], ["grid", {"mode": "m30"}], ["cmf", {"mode": "specimen"}], ["construction", {"mode": "list"}], ["rhythm", {"mode": "tight"}], ["meaning", {"mode": "line"}], ["bridge", {"type": "ledger", "place": "between", "anim": "stagger", "rows": [2, 0, 3], "head": "The same materials, the same rules"}], ["boundary", {"mode": "flush"}], ["creamHead", {"html": "BUILT FROM THE<br>SAME <span class=\"dl-hi\">RULES.</span>"}], ["imagery", {"mode": "tags"}]], "notes": "The specimen strip keeps the base’s proportions (46/34/12/8) but names material, finish and function under each."}, {"id": "11", "title": "ESSENTIAL / INCIDENTAL", "thesis": "Six of the nine are rules; three are features of a motorcycle. The incidental three are dimmed, and only the six travel across the bridge.", "m": [["chapters", {"names": ["THE PARENT", "THE EXTRACTION", "THE TRANSLATION"], "style": "num"}], ["intro", {"ey": "What we keep", "h4": "RULES, <span class=\"sw-cy\">NOT</span><br>SHAPES.", "p": "A shape belongs to one product. A rule belongs to every product after it. This board reads the SWITCH eSCRAMBLER for its rules — the things that will still be true when the object is a speaker, a lamp or a pack.", "type": "big"}], ["grid", {"mode": "m30"}], ["register", {"kind": "cross"}], ["cmf", {"mode": "rows"}], ["construction", {"mode": "frames"}], ["rhythm", {"mode": "tight"}], ["essential", {"mode": "dim"}], ["essential", {"mode": "tag"}], ["bridge", {"type": "ledger", "place": "between", "anim": "draw", "rows": [0, 1, 2], "head": "Six rules travel · three features stay"}], ["boundary", {"mode": "flush"}], ["territories", {"mode": "rulemap"}], ["creamHead", {"html": "THE RULES TRAVEL.<br>THE SHAPES <span class=\"dl-hi\">DON’T.</span>"}], ["imagery", {"mode": "tags"}], ["spine", {"mode": "datum"}]], "notes": "HORIZONTAL STANCE, RUBBER RIBBING and TANK PANEL are marked FEATURE and dimmed; the rest are RULE. The 3×3 stays intact."}, {"id": "12", "title": "MEANING BAND", "thesis": "Physical → meaning: a three-principle band closes the board (honesty, electric architecture, serviceability) and the bridge is a statement.", "m": [["chapters", {"names": ["THE PARENT", "THE EXTRACTION", "THE TRANSLATION"], "style": "num"}], ["intro", {"ey": "The reading", "h4": "WHAT IT LOOKS LIKE. <span class=\"sw-cy\">WHAT IT MEANS.</span>", "p": "Every physical decision on the parent stands for a behaviour. Exposed structure means honesty; a visible cell means the object is built around its energy; open joints mean it can be serviced. The behaviours are what carry.", "type": "big"}], ["grid", {"mode": "m16"}], ["register", {"kind": "bracket"}], ["cmf", {"mode": "rows"}], ["construction", {"mode": "rules"}], ["rhythm", {"mode": "tight"}], ["meaning", {"mode": "band"}], ["bridge", {"type": "statement", "place": "between", "anim": "stagger", "rows": [0, 1, 3], "big": "The behaviours carry.<br><span>The shapes stay behind.</span>", "text": "A SWITCH speaker is not a small motorcycle. It is honest about its structure, built around its energy, and made to be opened — because those are the rules, and the rules are what was bought."}], ["boundary", {"mode": "flush"}], ["creamHead", {"html": "SAME PRINCIPLES.<br>NEW <span class=\"dl-hi\">OBJECTS.</span>"}], ["territories", {"mode": "constraint"}], ["imagery", {"mode":
