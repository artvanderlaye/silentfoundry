<meta charset="utf-8">
<title>Design Language Layouts</title>
<style>
:root{--cy:#3ddcff;--ink:#0a0a0a;--gl:rgba(216,184,122,.10);}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:#e8e2d9;
 font:300 13px/1.5 "DM Sans",system-ui,sans-serif;
 background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);
 background-size:120px 120px;}
#wrap{max-width:1180px;margin:0 auto;padding:30px 24px 150px}
h1{font:300 11px/1 "DM Sans",sans-serif;letter-spacing:2.72px;text-transform:uppercase;color:#8d918a;margin:0 0 26px}
.col{width:497px;}
.bey{display:block;font-size:10.88px;font-weight:300;letter-spacing:2.72px;text-transform:uppercase;color:var(--cy);margin-bottom:16px}
.msw{display:flex;gap:10px;height:78px;margin-bottom:12px}
.msw i{display:block;border-radius:2px}
.mnm{display:block;font-size:11px;letter-spacing:1.9px;text-transform:uppercase;color:rgba(255,255,255,.80)}
.mcon{display:block;margin-top:7px;font-size:9.6px;letter-spacing:1.7px;text-transform:uppercase;color:rgba(255,255,255,.42)}
.cblk{margin-top:44px}
svg{display:block;width:100%;height:100%}
.ln path{stroke:var(--cy);stroke-width:2.1;vector-effect:non-scaling-stroke;
 stroke-linecap:round;stroke-linejoin:round;fill:none}
.ln.th path{stroke-width:1.3;opacity:.62}
.ln path.ax{stroke-dasharray:7 5}
/* ---- A · stacked rows ---- */
.rows{display:block}
.rows .r{display:grid;grid-template-columns:96px 1fr;column-gap:22px;align-items:center;
 padding:15px 0;border-top:1px solid rgba(61,220,255,.16)}
.rows .r:last-child{border-bottom:1px solid rgba(61,220,255,.16)}
.rows .fig{width:96px;height:70px}
.rows .t1{display:block;font-size:12.4px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.88)}
.rows .t2{display:block;font-size:9.6px;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.40);margin-top:4px}
/* ---- B · side by side ---- */
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid rgba(61,220,255,.16);
 border-bottom:1px solid rgba(61,220,255,.16)}
.cols .r{padding:18px 14px;text-align:center}
.cols .r + .r{border-left:1px solid rgba(61,220,255,.16)}
.cols .fig{width:100%;height:78px;margin-bottom:14px}
.cols .t1{display:block;font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:rgba(255,255,255,.88);line-height:1.35}
.cols .t2{display:block;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.40);margin-top:6px;line-height:1.4}
#bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,10,.96);
 border-top:1px solid rgba(216,184,122,.25);padding:14px 24px 18px;text-align:center}
.box{width:46px;height:38px;margin:0 5px;background:transparent;color:#d8b87a;
 border:1px solid rgba(216,184,122,.45);font:400 13px/1 "DM Sans",sans-serif;cursor:pointer}
.box.on{background:#d8b87a;color:#0a0a0a}
#nm{color:#8d918a;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:12px}
</style>
<div id="wrap">
 <h1>Silent Foundry — design language, two layouts</h1>
 <div class="col">
  <div class="mblk">
   <span class="bey">Materials &amp; construction</span>
   <div class="msw">
    <i style="flex:0 0 46%;background:repeating-linear-gradient(90deg,#c3c7c1,#c3c7c1 2px,#b3b7b1 2px,#b3b7b1 4px)"></i>
    <i style="flex:0 0 34%;background:linear-gradient(#26292d,#14171b)"></i>
    <i style="flex:0 0 12%;background:linear-gradient(#3ddcff,#00b4d8)"></i>
    <i style="flex:0 0 8%;background:linear-gradient(#f04b12,#e43c00)"></i>
   </div>
   <span class="mnm">Brushed aluminium &nbsp;·&nbsp; Matte black &nbsp;·&nbsp; SWITCH blue &nbsp;·&nbsp; HV orange</span>
   <span class="mcon">TIG welds &nbsp;·&nbsp; Exposed fasteners &nbsp;·&nbsp; CNC chamfers &nbsp;·&nbsp; Functional ribbing</span>
  </div>
  <div class="cblk">
   <span class="bey">Design language</span>
   <div id="dl"></div>
  </div>
 </div>
</div>
<div id="bar"><span id="boxes"></span><div id="nm"></div></div>
<script>
var ROWS=[["GO ANYWHERE", "terrain \u00b7 route \u00b7 movement", "<svg viewBox=\"0 0 100 68\" fill=\"none\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"ln\"><path d=\"M6 44 L28 44 C34 44 35 34 41 34 C47 34 48 44 54 44 L62 44 L62 30 L78 30 L78 20 L94 20\"/></g></svg>"], ["CARRY / WORK / MOVE", "load \u00b7 use \u00b7 transport", "<svg viewBox=\"0 0 100 68\" fill=\"none\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"ln\"><path d=\"M10 42 L90 42\"/><path d=\"M50 8 L50 34\"/><path d=\"M42 26 L50 34 L58 26\"/></g><g class=\"ln th\"><path d=\"M26 42 L20 56 L32 56 Z\"/><path d=\"M74 42 L68 56 L80 56 Z\"/></g></svg>"], ["MAINTAIN / MODIFY / KEEP", "service \u00b7 modularity \u00b7 life", "<svg viewBox=\"0 0 100 68\" fill=\"none\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"ln\"><path d=\"M34 22 L16 22 L16 50 L34 50\"/><path d=\"M66 22 L84 22 L84 50 L66 50\"/></g><g class=\"ln th\"><path class=\"ax\" d=\"M6 36 L94 36\"/><path d=\"M46 30 L46 42\"/><path d=\"M54 30 L54 42\"/></g></svg>"]];
var LAY=[["01","STACKED ROWS","rows"],["02","SIDE BY SIDE","cols"]];
function show(i){
  var L=LAY[i];
  document.getElementById('dl').innerHTML='<div class="'+L[2]+'">'+ROWS.map(function(r){
    return '<div class="r"><span class="fig">'+r[2]+'</span><span><span class="t1">'+r[0]+
           '</span><span class="t2">'+r[1]+'</span></span></div>';}).join('')+'</div>';
  document.getElementById('nm').textContent=L[1];
  [].forEach.call(document.getElementById('boxes').children,function(b,j){
    b.className='box'+(j===i?' on':'');});
}
LAY.forEach(function(L,i){var b=document.createElement('button');b.className='box';b.textContent=L[0];
 b.onclick=function(){show(i);};document.getElementById('boxes').appendChild(b);});
show(0);
</script>
