<style>
/* ==========================================================================
   SWITCH DNA TRANSFORM LAB
   Standalone exploration page. NOT production. index.html is untouched.

   00      = faithful reproduction of the current production Designed DNA
             section, captured from the live DOM. Control only — do not improve.
   01–30   = independent concepts. Each authors its own markup, its own scoped
             CSS and its own behaviour. Only the active concept is mounted;
             switching unmounts it and cancels every rAF / observer / listener.

   Design system per DESIGN-CHOICES.md:
     section entry ~100px · eyebrow -> headline 34px
     eyebrow  DM Sans 10.88px / 300 / 2.72px tracking / uppercase
     display headline  Bebas Neue, line-height 0.92
     cyan is an ACCENT, not a theme.
   ========================================================================== */

:root{
  --cream:#ede8e0;
  --paper:#f3efe8;
  --ink:#0a0a0a;
  --ink-78:rgba(10,10,10,0.78);
  --ink-55:rgba(10,10,10,0.55);
  --ink-38:rgba(10,10,10,0.38);
  --ink-26:rgba(10,10,10,0.26);
  --hair:rgba(10,10,10,0.10);
  --hair-soft:rgba(10,10,10,0.07);
  --gold:#8a6e3a;
  --gold-l:#c8a96e;
  --cy:#0a7f99;          /* SWITCH deep  — used for small type on cream   */
  --cy-b:#00b4d8;        /* SWITCH bright— used on dark, or for one accent */
  --dark:#0d0f12;
  --dark-2:#15181d;
  --pale:rgba(244,241,236,0.92);
  --dm:'DM Sans',sans-serif;
  --bb:'Bebas Neue',sans-serif;
  --frame:1600px;
  --pad:48px;
  --entry:100px;
  --eyegap:34px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream); color:var(--ink);
  font-family:var(--dm); font-weight:300;
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;                 /* clearance for the fixed lab bar */
}
img{display:block;max-width:100%;}

/* ---------- shared design-system atoms (available to every concept) ------ */
.ey{ font-family:var(--dm); font-size:10.88px; font-weight:300;
     letter-spacing:2.72px; text-transform:uppercase; display:block; margin:0; }
.ey--gold{color:var(--gold);} .ey--cy{color:var(--cy);} .ey--pale{color:rgba(244,241,236,0.5);}
.hl{ font-family:var(--bb); font-weight:400; line-height:0.92;
     letter-spacing:0.22em; text-transform:uppercase; margin:0;
     font-size:clamp(1.35rem,2.4vw,2.3rem); color:var(--ink-78); }
.hl span.a{color:var(--cy-b);}
.hl--big{font-size:clamp(2rem,5vw,4.6rem);letter-spacing:0.16em;}
.hl--pale{color:var(--pale);}
.bd{ font-size:0.9rem; line-height:1.85; color:var(--ink-55);
     font-weight:300; max-width:min(100%,680px); margin:0; }
.bd--pale{color:rgba(244,241,236,0.55);}
.mono{ font-family:var(--dm); font-size:0.52rem; letter-spacing:0.22em;
       text-transform:uppercase; color:var(--ink-38); }
.mono--cy{color:var(--cy);} .mono--gold{color:var(--gold);}
.rule{height:1px;background:var(--hair);border:0;margin:0;}

/* entry rhythm helpers — the production numbers */
.sec{ padding:var(--entry) var(--pad); }
.sec > .ey{ margin-bottom:var(--eyegap); }
.frame{ max-width:var(--frame); margin:0 auto; }

/* ---------- stage ------------------------------------------------------- */
#stage{ min-height:60vh; position:relative; }
#stage > *{ animation:fadein .28s ease both; }
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- lab chrome (kept visually separate from the concepts) ------- */
#labtop{
  position:sticky; top:0; z-index:60;
  background:#0a0a0a; color:#f4f1ec;
  border-bottom:1px solid rgba(244,241,236,0.14);
  display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
  padding:10px 16px;
  font-family:var(--dm); font-size:0.56rem; letter-spacing:0.22em; text-transform:uppercase;
}
#labtop b{font-weight:500;color:#c8a96e;letter-spacing:0.26em;}
#labtop .sp{color:rgba(244,241,236,0.34);}
#labtop .w{margin-left:auto;display:flex;gap:8px;}
#labtop .w button{
  font:inherit;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;
  background:transparent;color:rgba(244,241,236,0.62);
  border:1px solid rgba(244,241,236,0.22);padding:4px 9px;border-radius:2px;}
#labtop .w button:hover{color:#00b4d8;border-color:#00b4d8;}
#labtop .w button[aria-pressed="true"]{color:#0a0a0a;background:#c8a96e;border-color:#c8a96e;}

#labbar{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:#0a0a0a; border-top:1px solid rgba(244,241,236,0.14);
  padding:10px 14px 12px;
}
#labname{
  font-family:var(--dm); font-size:0.6rem; font-weight:400;
  letter-spacing:0.3em; text-transform:uppercase; color:#c8a96e;
  margin:0 0 8px 2px; display:flex; gap:14px; align-items:baseline;
}
#labname em{font-style:normal;color:rgba(244,241,236,0.42);letter-spacing:0.16em;
  font-size:0.52rem;text-transform:none;}
#labboxes{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
#labboxes button{
  font-family:var(--dm); font-size:0.58rem; font-weight:400; letter-spacing:0.06em;
  width:30px;height:26px;line-height:1;cursor:pointer;border-radius:2px;
  background:transparent; color:rgba(244,241,236,0.5);
  border:1px solid rgba(244,241,236,0.2);
  transition:background .16s,color .16s,border-color .16s;}
#labboxes button:hover{color:#00b4d8;border-color:rgba(0,180,216,0.6);}
#labboxes button.on{background:#c8a96e;border-color:#c8a96e;color:#0a0a0a;font-weight:500;}
#labboxes .nav{width:34px;color:rgba(244,241,236,0.66);}
@media(max-width:768px){
  :root{--pad:24px;--entry:100px;}
  #labboxes button{width:26px;height:24px;font-size:0.52rem;}
  body{padding-bottom:118px;}
}
</style>

<script>
/* =========================================================================
   LAB FRAMEWORK
   Mount one concept at a time. Every concept gets a ctx with registration
   helpers; unmounting cancels everything it registered, so no concept keeps
   running in the background.
   ========================================================================= */
var IMG = {
  bike      : 'images/SWITCH_eSCRAMBLER_bike-6.jpg',
  dirt      : 'images/eSCRAMBLER_dirt-13.jpg',
  frameA    : 'images/frame_factory-431.jpg',
  frameB    : 'images/frame_factory-285.jpg',
  frameC    : 'images/frame_factory-157.jpg',
  frameD    : 'images/frame_factory-413.png',
  cadScreen : 'images/cad-screen.jpg',
  cadTex    : 'images/cad_texture.jpeg',
  cadWide   : 'images/cad_texture_wide.jpg',
  cnc       : 'images/cnc_1-14.jpg',
  cnc2      : 'images/cnc-cutting.jpg',
  proto     : 'images/prototype_assembly.jpg',
  pcb       : 'images/pcb-board.jpg',
  battery   : 'images/battery_gold.png',
  batteryP  : 'images/switch_battery.jpg',
  speaker   : 'images/switch_speaker.png',
  snowboard : 'images/snowboard.jpg',
  guitar    : 'images/guitar.jpg',
  light     : 'images/switch-professional-task-light.jpg',
  amp       : 'images/Upscaled_amp.png',
  logoSW    : 'images/Switchlogowhite2.png',
  logoES    : 'images/logo-escrambler.png'
};

/* the eight principles — fixed vocabulary, never renamed (DESIGN-CHOICES §25) */
var P8 = ['FORM','STRUCTURE','CMF','SIGNATURE DETAILS','STANCE','MANUFACTURING','MODULARITY','SERVICEABILITY'];
var P8_NOTE = {
  'FORM':'Flat top line, dropped mass, nothing decorative.',
  'STRUCTURE':'Visible trellis. The frame is the styling.',
  'CMF':'Raw alloy, matte black, one cyan mark.',
  'SIGNATURE DETAILS':'Exposed fasteners. Machined edges left machined.',
  'STANCE':'Wide track, low centre, planted.',
  'MANUFACTURING':'Tube, plate, fold, weld — small-batch tooling.',
  'MODULARITY':'A slab that carries the energy, wherever it sits.',
  'SERVICEABILITY':'Opened with the tools the owner already has.'
};
/* which principles survive a category change — used by several concepts */
var CATS = [
  {k:'SOUND',     img:'speaker',   note:'Slab body, exposed fixings, one cyan mark.'},
  {k:'POWER',     img:'battery',   note:'The energy module leaves the frame intact.'},
  {k:'WORKSPACE', img:'light',     note:'Machined arm, planted base, serviceable head.'},
  {k:'MOBILITY',  img:'snowboard', note:'Stance and edge geometry, no engine.'},
  {k:'INSTRUMENT',img:'guitar',    note:'Trellis logic as a bolted, repairable body.'}
];

/* ---------- shared SVG vocabulary --------------------------------------
   Hand-authored reductions of the eSCRAMBLER's actual geometry: two equal
   circles, a flat top line, a dropped slab, a triangulated centre. The same
   radius / angle / cut vocabulary then generates the other categories, which
   is the point being argued.
   ---------------------------------------------------------------------- */
var GEO = {
  bike:
    'M22 62 A16 16 0 1 0 22 62.01 Z' , /* placeholder, real paths below */
  /* side elevation, 200x100 viewBox */
  bikePath: [
    'M34 70 m-18 0 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0',      /* rear wheel */
    'M166 70 m-18 0 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0',     /* front wheel */
    'M40 44 L150 44',                                          /* flat top line */
    'M62 46 L62 66 L112 66 L112 46 Z',                         /* battery slab */
    'M40 44 L62 66 M150 44 L112 66 M62 46 L112 46',            /* trellis */
    'M150 44 L166 52 M166 52 L166 70'                          /* fork */
  ],
  speakerPath: [
    'M52 30 L148 30 L148 78 L52 78 Z',
    'M62 40 L138 40 L138 68 L62 68 Z',
    'M52 78 L62 88 M148 78 L138 88',
    'M70 34 m-2 0 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0',
    'M130 34 m-2 0 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0'
  ],
  batteryPath: [
    'M66 26 L134 26 L134 84 L66 84 Z',
    'M76 26 L76 84 M124 26 L124 84',
    'M66 40 L134 40 M66 70 L134 70',
    'M92 18 L108 18 L108 26 L92 26 Z'
  ],
  lightPath: [
    'M60 84 L140 84 L140 88 L60 88 Z',
    'M100 84 L100 44',
    'M100 44 L146 30',
    'M146 30 m-10 0 a10 10 0 1 0 20 0 a10 10 0 1 0 -20 0',
    'M92 84 L108 84 L108 78 L92 78 Z'
  ],
  boardPath: [
    'M30 50 C30 34 62 28 100 28 C138 28 170 34 170 50 C170 66 138 72 100 72 C62 72 30 66 30 50 Z',
    'M56 42 L84 42 L84 58 L56 58 Z',
    'M116 42 L144 42 L144 58 L116 58 Z',
    'M30 50 L170 50'
  ],
  guitarPath: [
    'M56 44 L120 44 L120 66 L56 66 Z',
    'M120 52 L176 52 L176 58 L120 58 Z',
    'M176 46 L188 46 L188 64 L176 64 Z',
    'M68 48 L68 62 M80 48 L80 62 M92 48 L92 62'
  ]
};
function svgOf(paths, opt){
  opt = opt||{};
  var vb  = opt.vb || '0 0 200 100';
  var sw  = opt.sw || 1.1;
  var st  = opt.stroke || 'rgba(10,10,10,0.55)';
  var cls = opt.cls || '';
  var out = '<svg class="'+cls+'" viewBox="'+vb+'" fill="none" preserveAspectRatio="xMidYMid meet" aria-hidden="true">';
  paths.forEach(function(d,i){
    out += '<path d="'+d+'" stroke="'+st+'" stroke-width="'+sw+'" vector-effect="non-scaling-stroke"'
        +  ' stroke-linecap="round" stroke-linejoin="round" data-i="'+i+'"/>';
  });
  return out+'</svg>';
}

/* ---------- concept registry & lifecycle -------------------------------- */
var CONCEPTS = [];
function C(n,name,desc,build){ CONCEPTS[n]={n:n,name:name,desc:desc,build:build}; }

var LIVE = { raf:[], obs:[], lis:[], tmr:[] };
var MOTION = true;
function ctxFactory(){
  return {
    frame:function(fn){                     /* rAF loop that auto-stops */
      var id, run=function(t){ if(!MOTION){ id=requestAnimationFrame(run); LIVE.raf[LIVE.raf.length-1]=id; return; }
        fn(t); id=requestAnimationFrame(run); LIVE.raf[LIVE.raf.indexOf(prev)]=id; prev=id; };
      var prev=requestAnimationFrame(run); LIVE.raf.push(prev);
    },
    on:function(target,type,fn,opt){ target.addEventListener(type,fn,opt||{passive:true});
      LIVE.lis.push([target,type,fn,opt]); },
    obs:function(o){ LIVE.obs.push(o); return o; },
    timer:function(fn,ms){ var t=setInterval(fn,ms); LIVE.tmr.push(t); return t; },
    delay:function(fn,ms){ var t=setTimeout(fn,ms); LIVE.tmr.push(t); return t; },
    /* scroll progress 0..1 across an element's travel through the viewport */
    prog:function(el){
      var r=el.getBoundingClientRect(), vh=innerHeight;
      return Math.max(0, Math.min(1, (vh - r.top) / (vh + r.height)));
    },
    /* progress while a sticky child is pinned inside a tall parent */
    pinProg:function(el){
      var r=el.getBoundingClientRect();
      var total = el.offsetHeight - innerHeight;
      if(total<=0) return 0;
      return Math.max(0, Math.min(1, (-r.top)/total));
    }
  };
}
function teardown(){
  LIVE.raf.forEach(function(id){cancelAnimationFrame(id);});
  LIVE.obs.forEach(function(o){ try{o.disconnect();}catch(e){} });
  LIVE.lis.forEach(function(l){ try{l[0].removeEventListener(l[1],l[2],l[3]);}catch(e){} });
  LIVE.tmr.forEach(function(t){ clearInterval(t); clearTimeout(t); });
  LIVE={raf:[],obs:[],lis:[],tmr:[]};
}

var stage=document.getElementById('stage'), CUR=-1;
function show(n){
  if(!CONCEPTS[n]) return;
  teardown();
  stage.innerHTML='';
  window.scrollTo(0,0);
  CUR=n;
  var c=CONCEPTS[n];
  document.getElementById('labnum').textContent=(n<10?'0':'')+n;
  document.getElementById('labtitle').textContent=c.name;
  document.getElementById('labdesc').textContent=c.desc||'';
  [].forEach.call(document.querySelectorAll('#labboxes button[data-n]'),function(b){
    b.classList.toggle('on', +b.dataset.n===n); });
  try{ c.build(stage, ctxFactory()); }
  catch(e){ stage.innerHTML='<div class="sec"><p class="mono">concept '+n+' failed: '+e.message+'</p></div>'; }
  history.replaceState(null,'','#c='+((n<10?'0':'')+n));
}
</script>

roducts — while keeping each product recognisably SWITCH.  The opportunity is not simply to create individual products, but to build connected product families around a shared design language, manufacturing logic and component system. Each new category expands the commercial potential of the same underlying platform.</div></div></div><div style="height:60px"></div></div></template>

/* =========================================================================

   ========================================================================= */

  var A=[
    {n:'01',t:'The top line never breaks',p:'Tank to tail is one uninterrupted run. Every SWITCH object since has been built to keep a line like this — which is why a speaker and a lamp can sit in the same family photograph.',x:'34%',y:'30%'},
    {n:'02',t:'The frame is not hidden',p:'Most manufacturers cover structure. SWITCH triangulates it and leaves it in the light. Structure-as-styling is portable to almost any category.',x:'52%',y:'56%'},
    {n:'03',t:'The energy is a slab',p:'A removable rectangular pack, mounted low. Once energy is a module rather than a fixed system, the product it sits inside becomes negotiable.',x:'42%',y:'70%'},
    {n:'04',t:'One cyan mark, never two',p:'Colour is used as a signature, not a scheme. It survives translation into materials the motorcycle never used.',x:'70%',y:'42%'}
  ];

  '<style>'+
  '.xc{background:var(--paper);padding:var(--entry) var(--pad) 110px;}'+
  '.xc .in{max-width:1180px;margin:0 auto;}'+
  '.xc .lede{max-width:min(100%,620px);margin-top:26px;}'+
  '.xc .plate{position:relative;margin-top:64px;aspect-ratio:3/2;background:#ddd7cd;overflow:hidden;}'+
  '.xc .plate img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08) brightness(1.02);}'+
  '.xc .pt{position:absolute;width:13px;height:13px;border-radius:50%;border:1px solid var(--ink);'+
    'background:rgba(255,255,255,.7);transform:translate(-50%,-50%);cursor:pointer;transition:background .3s,border-color .3s,transform .3s;}'+
  '.xc .pt.on{background:var(--cy-b);border-color:var(--cy-b);transform:translate(-50%,-50%) scale(1.35);}'+
  '.xc .pt::after{content:attr(data-n);position:absolute;left:18px;top:-4px;font-family:var(--dm);font-size:.46rem;'+
    'letter-spacing:.2em;color:var(--ink-38);}'+
  '.xc .notes{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);margin-top:1px;}'+
  '.xc .nt{background:var(--paper);padding:22px 20px 26px;cursor:pointer;transition:background .3s;}'+
  '.xc .nt.on{background:#fff;}'+
  '.xc .nt .no{font-family:var(--dm);font-size:.46rem;letter-spacing:.26em;color:var(--ink-26);}'+
  '.xc .nt h4{font-family:var(--dm);font-size:.78rem;font-weight:500;letter-spacing:.02em;color:var(--ink-78);margin:10px 0 8px;line-height:1.35;}'+
  '.xc .nt.on h4{color:var(--cy);}'+
  '.xc .nt p{font-size:.66rem;line-height:1.65;color:var(--ink-38);margin:0;}'+
  '@media(max-width:900px){.xc .notes{grid-template-columns:1fr 1fr;}}'+
  '</style>'+
  '<section class="xc"><div class="in">'+
    '<span class="ey ey--gold">Designed DNA: SWITCH</span>'+
    '<h2 class="hl" style="margin-top:var(--eyegap)">Four decisions,<br>examined properly.</h2>'+
    '<p class="bd lede">Silent Foundry went through the eSCRAMBLER looking for the smallest number of decisions that would still read as SWITCH if everything else changed. It came to four.</p>'+
    '<div class="plate"><img src="'+IMG.bike+'" alt="">'+
      A.map(function(a,i){return '<span class="pt" data-i="'+i+'" data-n="'+a.n+'" style="left:'+a.x+';top:'+a.y+'"></span>';}).join('')+
    '</div>'+
    '<div class="notes">'+A.map(function(a,i){
      return '<div class="nt" data-i="'+i+'"><span class="no">'+a.n+'</span><h4>'+a.t+'</h4><p>'+a.p+'</p></div>';}).join('')+'</div>'+
  '</div></section>';
  var pts=[].slice.call(root.querySelectorAll('.xc .pt')), nts=[].slice.call(root.querySelectorAll('.xc .nt'));
  function pick(i){ pts.forEach(function(p,k){p.classList.toggle('on',k===i);});

  pts.forEach(function(p,i){ ctx.on(p,'mouseenter',function(){auto=false;pick(i);}); });
  nts.forEach(function(n,i){ ctx.on(n,'mouseenter',function(){auto=false;pick(i);}); });
  var c=0,auto=true; pick(0);
  ctx.timer(function(){ if(!auto||!MOTION)return; c=(c+1)%A.length; pick(c); },2600);
});

<script>
/* =========================================================================
   BOOTSTRAP — numbered boxes on the bar (CLAUDE.md house rule: boxes, not a
   drag slider), arrow keys, deep link, motion + frame-guide toggles.
   ========================================================================= */
(function(){
  var boxes=document.getElementById('labboxes');
  var prev=document.createElement('button'); prev.className='nav'; prev.textContent='‹'; prev.title='previous';
  boxes.appendChild(prev);
  for(var i=0;i<=30;i++){
    var b=document.createElement('button');
    b.dataset.n=i; b.textContent=(i<10?'0':'')+i;
    b.title=(CONCEPTS[i]?CONCEPTS[i].name:'');
    b.addEventListener('click',(function(n){return function(){show(n);};})(i));
    boxes.appendChild(b);
  }
  var next=document.createElement('button'); next.className='nav'; next.textContent='›'; next.title='next';
  boxes.appendChild(next);
  prev.addEventListener('click',function(){ show((CUR+30)%31); });
  next.addEventListener('click',function(){ show((CUR+1)%31); });

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){ show((CUR+1)%31); }
    else if(e.key==='ArrowLeft'){ show((CUR+30)%31); }
  });

  document.getElementById('tgAnim').addEventListener('click',function(){
    MOTION=!MOTION; this.setAttribute('aria-pressed',String(MOTION));
    this.textContent = MOTION?'motion on':'motion off';
  });
  document.getElementById('tgGrid').addEventListener('click',function(){
    var on=document.body.classList.toggle('guides');
    this.setAttribute('aria-pressed',String(on));
  });
  var g=document.createElement('style');
  g.textContent='body.guides #stage{position:relative;}'+
    'body.guides #stage::before{content:"";position:fixed;left:50%;top:0;bottom:0;width:min(1600px,100vw);'+
    'transform:translateX(-50%);border-left:1px solid rgba(0,180,216,.35);border-right:1px solid rgba(0,180,216,.35);'+
    'pointer-events:none;z-index:50;}'+
    'body.guides #stage::after{content:"1600 FRAME";position:fixed;left:50%;top:52px;transform:translateX(-50%);'+
    'font:400 9px/1 \'DM Sans\',sans-serif;letter-spacing:.24em;color:rgba(0,180,216,.8);z-index:50;pointer-events:none;}';
  document.head.appendChild(g);

  var m=/[#&]c=(\d+)/.exec(location.hash);
  show(m ? Math.max(0,Math.min(30,+m[1])) : 0);
})();
</script>
