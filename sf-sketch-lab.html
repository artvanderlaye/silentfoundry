var ORDER=["v","u","x","c","f","d","t","e","g","i","o","n","l","p"];
var OPF={t:.45,u:.88,i:.45,g:.50,x:.50,p:1.13};
var BASE=.30,PEAK=.92,UP=1250,DOWN=2100,STEP=900,E="cubic-bezier(.4,0,.6,1)";
var svg=document.getElementById("dna");
svg.innerHTML='<g id="skg"><image href="images/bike-side-sketch.png" '+
 'x="246.9" y="256.8" width="1534.7" height="854.3" preserveAspectRatio="none"/></g>'+
 '<defs><clipPath id="cl" clipPathUnits="userSpaceOnUse">'+
 '<path clip-rule="evenodd" d="M0 0 H2000 V1333 H0 Z '+S.x[0]+' Z"/></clipPath></defs>'+
 Object.keys(S).map(function(k){return '<g data-k="'+k+'"'+
  (k==="v"||k==="u"||k==="t"?' clip-path="url(#cl)"':'')+'>'+
  S[k].map(function(d){return '<path d="'+d+'"/>';}).join("")+"</g>";}).join("");
var sk=document.getElementById("skg");
var tok=0,TM=[];
function at(ms,fn){var t=tok;TM.push(setTimeout(function(){if(t===tok)fn();},ms));}
function G(k){return svg.querySelector('g[data-k="'+k+'"]');}
function setG(k,o,ms){var g=G(k);if(!g)return;
 g.style.transition=ms===0?"none":"opacity "+ms+"ms "+E;
 g.style.opacity=o<=0?0:(o*(OPF[k]||1)).toFixed(3);}
function SK(o,ms){sk.style.transition=ms===0?"none":"opacity "+ms+"ms "+E;sk.style.opacity=o;}

var DIR=[
["01","WHITE — AS IT IS ON DEV NOW",
 "The page inverts the sketch to white. Peak 0.49, residue 0.11 — halved from BASE 4's numbers so the ink on the photograph matches: 93 levels at the peak, 21 at the residue.",

["02","BLACK — EXACTLY AS BASE 4",

 {inv:false,peak:1,res:.22}]
];
function reset(){tok++;TM.forEach(clearTimeout);TM=[];
 sk.setAttribute("class","");SK(0,0);
 ORDER.forEach(function(k){setG(k,0,0);});
 void svg.getBoundingClientRect();}
function run(C){
 sk.setAttribute("class",C.inv?"inv":"");
 ORDER.forEach(function(k){setG(k,BASE,0);});
 at(2200,function(){SK(C.peak,650);});
 at(3450,function(){SK(C.res,800);});
 at(6850,function(){SK(0,1600);});
 at(DOWN+1300,function(){setG("p",0,1000);});
 var K=ORDER.filter(function(k){return k!=="p";}),i=0;
 at(DOWN,function pulse(){var k=K[i];setG(k,PEAK,UP);
  at(UP,function(){setG(k,BASE,DOWN);});i=(i+1)%K.length;at(STEP,pulse);});
}
var cur=-1,boxes=document.getElementById("boxes");
DIR.forEach(function(v,i){var b=document.createElement("button");
 b.className="box";b.textContent=v[0];
 b.addEventListener("click",function(){show(i);});boxes.appendChild(b);});
function show(i){cur=i;reset();
 [].forEach.call(boxes.children,function(b,j){b.className="box"+(j===i?" on":"");});
 document.getElementById("rNum").textContent=DIR[i][0];
 document.getElementById("rName").textContent=DIR[i][1];
 document.getElementById("rNote").textContent=DIR[i][2];
 run(DIR[i][3]);}
document.getElementById("replay").addEventListener("click",function(){show(cur<0?0:cur);});
document.addEventListener("keydown",function(e){
 if(e.key==="ArrowRight")show((cur+1)%DIR.length);
 if(e.key==="ArrowLeft")show((cur-1+DIR.length)%DIR.length);});
