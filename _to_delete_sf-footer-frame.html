<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0a0a0a;}
:root{

}
.ft{position:relative;background:var(--ink);overflow:hidden;
  border-bottom-left-radius:var(--r,0px);border-bottom-right-radius:var(--r,0px);}
.ft::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
   repeating-linear-gradient(0deg,transparent,transparent 15px,var(--grid) 15px,var(--grid) 16px),
   repeating-linear-gradient(90deg,transparent,transparent 15px,var(--grid) 15px,var(--grid) 16px);}
.fi{position:relative;z-index:1;display:grid;align-items:start;
  gap:var(--gap);padding:var(--top) var(--pad) var(--bot);}
.z{min-width:0;}
.logo{display:block;width:160px;height:50px;}
.logo svg{display:block;width:100%;height:100%;}
.tag{margin:19px 0 0;font:300 var(--body)/1.9 "DM Sans",sans-serif;color:var(--mid);max-width:280px;}
h5{margin:0 0 20px;font:700 var(--h5)/1.2 "DM Sans",sans-serif;letter-spacing:var(--h5ls);
  text-transform:uppercase;color:var(--gold);}
address{font:300 var(--body)/var(--lh) "DM Sans",sans-serif;color:var(--mid);font-style:normal;}
.nav a,.bnav a{display:block;font:300 var(--body)/var(--lh) "DM Sans",sans-serif;
  color:var(--mid);text-decoration:none;}
.bnav{margin-top:18px;}
.fb{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;
  gap:18px;padding:16px var(--pad);flex-wrap:wrap;}
.cr{font:300 8.32px/1.4 "DM Sans",sans-serif;letter-spacing:1px;color:rgba(244,241,236,.25);}
.util{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.util a{font:300 10.4px/1.4 "DM Sans",sans-serif;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--mid);text-decoration:none;}
.util i{font-style:normal;color:rgba(200,169,110,.35);font-size:9px;}
.urow{position:relative;z-index:1;display:flex;justify-content:center;
  padding:0 var(--pad) 26px;}
.band2{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;
  gap:20px;padding:22px var(--pad) 24px;border-top:1px solid rgba(200,169,110,.10);flex-wrap:wrap;}
.tstrip{position:relative;z-index:1;display:flex;justify-content:flex-end;
  padding:18px var(--pad) 0;}
.ogi{display:grid;gap:var(--gap);}
/* the four written line breaks hold; nothing wraps by accident */
address,.nav a{overflow-wrap:normal;}
