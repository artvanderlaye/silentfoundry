<meta charset="utf-8">
<title>DNA + Territory Lab</title>
<style>
:root{--cy:#3ddcff;--ink:#0a0a0a;--pan:#0d1013;--gl:rgba(216,184,122,.09);--cream:#ede8e0;}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:#e8e2d9;
 font:300 13px/1.5 "DM Sans",system-ui,-apple-system,sans-serif;}
#wrap{max-width:1600px;margin:0 auto;padding:26px 24px 190px}
h1{font:300 11px/1 "DM Sans",sans-serif;letter-spacing:2.72px;text-transform:uppercase;color:#8d918a;margin:0 0 6px}
#rd{margin:0 0 22px}
#rNum{color:#d8b87a;letter-spacing:2px;font-size:11px}
#rName{font-size:21px;font-weight:300;letter-spacing:1px;margin:6px 0 8px}
#rNote{color:#8d918a;max-width:min(100%,720px);font-size:12.4px}
/* ---------- the board ---------- */
.board{background:var(--pan);padding:44px 48px 52px;position:relative;
 background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);
 background-size:110px 110px;}
.split{display:grid;grid-template-columns:1fr 497px;gap:56px;align-items:start}
.bey{display:block;font-size:10.88px;font-weight:300;letter-spacing:2.72px;
 text-transform:uppercase;color:var(--cy);margin-bottom:18px}
/* FORM & ARCHITECTURE — LOCKED */
.dna9{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 18px}
.d9{display:block;text-align:center}
.nw{display:block;width:101px;height:101px;margin:0 auto}
.nt{display:block;width:100%;height:100%}
.nt path{fill:none;stroke:var(--cy);stroke-width:2.1;vector-effect:non-scaling-stroke;
 stroke-linecap:round;stroke-linejoin:round}
.dl{display:block;margin-top:12px;font-size:11.6px;letter-spacing:2.1px;
 text-transform:uppercase;color:rgba(255,255,255,.86);line-height:1.4;min-height:2.6em}
/* materials */
.msw{display:flex;gap:10px;height:78px;margin-bottom:12px}
.msw i{display:block;border-radius:2px}
.mnm{display:block;font-size:11px;letter-spacing:1.9px;text-transform:uppercase;color:rgba(255,255,255,.80)}
.mcon{display:block;margin-top:7px;font-size:9.2px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.42)}
.cblk{margin-top:30px}
.cg{display:block;width:100%;height:100%}
.cg path{fill:none;stroke:var(--cy);stroke-width:2.1;vector-effect:non-scaling-stroke;
 stroke-linecap:round;stroke-linejoin:round}
.cg .th path{stroke-width:1.3;opacity:.6}
.cg.fillp path{fill:var(--cy);fill-opacity:.14}
/* construction rows */
.crows .cr{display:grid;grid-template-columns:96px 1fr;column-gap:20px;align-items:center;
 padding:11px 0;border-top:1px solid rgba(61,220,255,.16)}
.crows .cr:last-child{border-bottom:1px solid rgba(61,220,255,.16)}
.cfig{display:block;width:96px;height:50px}
.ct1{display:block;font-size:12.4px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.88)}
.ct2{display:block;margin-top:3px;font-size:9.2px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.40)}
/* 02 sequence */
.seq{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;border-top:1px solid rgba(61,220,255,.16);
 border-bottom:1px solid rgba(61,220,255,.16);padding:14px 0}
.seq .cg{height:52px}
.seqk{display:block;margin-top:9px;font-size:9.2px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.42)}
/* 04 grammar */
.gram{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;border-top:1px solid rgba(61,220,255,.16);padding-top:14px}
.gram > span{display:block;text-align:center}
.gf{display:block;height:48px}
.gl{display:block;margin-top:8px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.46)}
/* 05 stack */
.stack .sr{display:grid;grid-template-columns:22px 74px 1fr;column-gap:16px;align-items:center;
 padding:10px 0;border-top:1px solid rgba(61,220,255,.14)}
.stack .sr:last-child{border-bottom:1px solid rgba(61,220,255,.14)}
.sn{font-size:9px;letter-spacing:1.6px;color:rgba(61,220,255,.55)}
.sf{display:block;width:74px;height:52px}
.sl1{display:block;font-size:12px;letter-spacing:1.9px;text-transform:uppercase;color:rgba(255,255,255,.88)}
.sl2{display:block;margin-top:3px;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.40)}
/* ---------- the territory section ---------- */
.terrsec{background:var(--cream);color:#0a0a0a;padding:52px 48px 58px}
.thead{margin-bottom:34px}
.terrsec .bey{color:#0a7f99}
.thead h3{margin:0;font:300 clamp(1.6rem,2.6vw,2.5rem)/0.98 "Bebas Neue","DM Sans",sans-serif;
 letter-spacing:.06em;text-transform:uppercase;color:rgba(10,10,10,.9)}
.terr{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid rgba(10,127,153,.3)}
.terr .tc{padding:24px 20px 6px;text-align:center}
.terr .tc + .tc{border-left:1px solid rgba(10,127,153,.18)}
.tfig{display:block;height:64px;margin-bottom:16px}
.tfig .cg path{stroke:#0a7f99;stroke-width:2.4}
.tfig .cg.fillp path{fill:#0a7f99;fill-opacity:.12}
.tn{display:block;font-size:14px;letter-spacing:2.4px;text-transform:uppercase;color:rgba(10,10,10,.88)}
.td{display:block;margin-top:6px;font-size:9.6px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(10,127,153,.78);line-height:1.5}
/* product slider stand-in */
.slider{background:#c9c4bb;padding:22px 48px;display:flex;gap:10px;align-items:center}
.slider i{display:block;height:76px;flex:1;background:rgba(10,10,10,.10);border:1px solid rgba(10,10,10,.12)}
.slabel{font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:rgba(10,10,10,.45);white-space:nowrap;margin-right:14px}
/* bar */
#bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,10,.96);
 border-top:1px solid rgba(216,184,122,.25);padding:13px 24px 16px;text-align:center}
.box{width:46px;height:38px;margin:0 5px;background:transparent;color:#d8b87a;
 border:1px solid rgba(216,184,122,.45);font:400 13px/1 "DM Sans",sans-serif;cursor:pointer}
.box.on{background:#d8b87a;color:#0a0a0a}
#nm{color:#8d918a;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;margin-top:10px}
@media(max-width:1100px){.split{grid-template-columns:1fr;gap:38px}.terr{grid-template-columns:repeat(2,1fr)}}
</style>
